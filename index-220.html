<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réunion IA</title>
<meta name="description" content="Application de réunion intelligente : enregistrement, transcription, comptes rendus IA et mémoire de l'organisation.">
<meta name="theme-color" content="#16232A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#16232A;
    --bg-elevated:#1E323B;
    --bg-card:#20343D;
    --accent:#E8A33D;
    --accent-live:#E1614F;
    --accent-2:#4FA8A0;
    --accent-3:#7C93C9;
    --text:#F2EDE4;
    --text-muted:#9CB0B6;
    --border:rgba(242,237,228,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg) url('app-background.png') center/cover no-repeat fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
  }
  .app{
    padding:20px 16px 28px;
    flex:1;
    overflow-y:auto;
  }
  .app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background-color:var(--bg);
    background-image:linear-gradient(rgba(232,163,61,0.15), rgba(232,163,61,0.15));
    z-index:5;
  }
  .app-logo{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:16.5px;
    font-weight:600;
  }
  .app-header-right{display:flex;align-items:center;gap:12px;}
  .clock-block{
    text-align:right;
    line-height:1.25;
  }
  .clock-time{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:15px;
    font-variant-numeric:tabular-nums;
    color:var(--accent);
  }
  .clock-date{font-size:10.5px;color:var(--text-muted);text-transform:capitalize;}
  .settings-btn{
    background:none;border:none;
    font-size:18px;cursor:pointer;
    color:var(--text);
    padding:4px;
    line-height:1;
  }
  .tab-bar{
    display:flex;
    border-top:1px solid var(--border);
    background:var(--bg-card);
    position:sticky;
    bottom:0;
    z-index:5;
  }
  .tab-btn{
    flex:1;
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:9px 4px 11px;
    color:var(--text-muted);
    font-size:10.5px;
    font-family:inherit;
    cursor:pointer;
  }
  .tab-btn .tab-icon{font-size:17px;}
  .tab-btn.active{color:var(--accent);}
  .app-shell.fullscreen-mode .app-header,
  .app-shell.fullscreen-mode .tab-bar{display:none;}
  .app-shell.fullscreen-mode .assistant-fab{display:none;}

  .assistant-fab{
    position:fixed;
    right:16px;
    bottom:78px;
    background:var(--accent);
    color:#20140A;
    border:none;
    border-radius:22px;
    padding:11px 16px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    z-index:8;
    font-family:inherit;
  }

  .assistant-overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:50;
  }
  .assistant-inner{
    max-width:480px;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  .assistant-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .assistant-title{font-family:Georgia,"Iowan Old Style",serif;font-size:16px;font-weight:600;}
  .assistant-close{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px;}
  .assistant-messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
  }
  .msg{
    max-width:85%;
    padding:10px 13px;
    border-radius:13px;
    font-size:14px;
    line-height:1.5;
    margin-bottom:10px;
  }
  .msg.user{
    background:var(--accent);
    color:#20140A;
    margin-left:auto;
    border-bottom-right-radius:4px;
  }
  .msg.assistant{
    background:var(--bg-card);
    color:var(--text);
    margin-right:auto;
    border-bottom-left-radius:4px;
  }
  .msg.assistant.loading{color:var(--text-muted);font-style:italic;}
  .assistant-suggestions{display:flex;flex-direction:column;gap:8px;}
  .suggestion-chip{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    color:var(--text);
    text-align:left;
    cursor:pointer;
    font-family:inherit;
  }
  .assistant-input-row{
    display:flex;
    gap:8px;
    padding:12px 16px;
    border-top:1px solid var(--border);
    align-items:flex-end;
  }
  .assistant-input-row textarea{
    flex:1;
    min-height:42px;
    max-height:100px;
    resize:none;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
  }
  .assistant-send{
    background:var(--accent);
    border:none;
    border-radius:10px;
    width:42px;height:42px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    color:#20140A;
  }
  h1,h2,h3{
    font-family:Georgia,"Iowan Old Style",serif;
    font-weight:600;
    margin:0;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  header.top h1{font-size:22px;}
  header.top span{
    color:var(--text-muted);
    font-size:13px;
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-accent{background:var(--accent);color:#20140A;}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:var(--accent-live);color:#2A0E0A;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .fab-new{
    display:block;
    width:100%;
    margin-bottom:18px;
  }

  .card{
    background:var(--bg-card);
    border-left:3px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .card.status-enregistrement{border-left-color:var(--accent-live);}
  .card.status-termine{border-left-color:var(--accent);}
  .card-date{
    flex-shrink:0;
    width:40px;
    text-align:center;
    font-size:11.5px;
    line-height:1.5;
    color:var(--text-muted);
    text-transform:uppercase;
    padding-top:1px;
  }
  .card h3{font-size:16px;margin-bottom:4px;}
  .card .meta{font-size:12.5px;color:var(--text-muted);}
  .card-body{flex:1;min-width:0;}
  .card-delete{
    background:none;border:none;
    font-size:15px;
    color:var(--text-muted);
    cursor:pointer;
    padding:4px 2px;
    flex-shrink:0;
    align-self:flex-start;
  }
  .card-delete:hover{color:var(--accent-live);}

  .month-label{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:13px;
    color:var(--text-muted);
    text-transform:capitalize;
    margin:18px 0 8px;
  }
  .month-group:first-child .month-label{margin-top:4px;}
  .filters-toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .filter-badge{color:var(--accent);font-size:10px;margin-left:5px;}
  .filters-block{background:var(--bg-card);border-radius:10px;padding:12px;margin-bottom:12px;}
  .filters-row{display:flex;gap:8px;margin-bottom:8px;}
  .filters-row:last-child{margin-bottom:0;}
  .filters-row select, .filters-row input{
    flex:1;
    min-width:0;
    max-width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    color:var(--text);
    font-size:12.5px;
    font-family:inherit;
    text-overflow:ellipsis;
  }
  .filters-block [data-clear-filters]{margin-top:8px;}
  .empty{
    text-align:center;
    color:var(--text-muted);
    padding:60px 20px;
    font-size:14.5px;
    line-height:1.6;
  }

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:11px 12px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
  }
  .field textarea{min-height:120px;resize:vertical;line-height:1.5;}

  .back{
    color:var(--text-muted);
    font-size:14px;
    background:none;
    border:none;
    cursor:pointer;
    padding:0 0 16px;
    font-family:inherit;
  }

  .detail-header{margin-bottom:18px;}
  .detail-header .meta{color:var(--text-muted);font-size:13px;margin-top:4px;}

  .record-zone{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 0 10px;
    margin-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .record-btn{
    width:86px;height:86px;
    border-radius:50%;
    border:none;
    background:var(--accent-live);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    position:relative;
  }
  .record-btn .dot{width:26px;height:26px;border-radius:6px;background:#2A0E0A;}
  .record-btn.idle{background:var(--accent);}
  .record-btn.idle .dot{border-radius:50%;background:#20140A;}
  .record-btn.pulse::after{
    content:"";
    position:absolute;inset:-8px;
    border-radius:50%;
    border:2px solid var(--accent-live);
    animation:pulse 1.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(1);opacity:0.7;}
    100%{transform:scale(1.35);opacity:0;}
  }
  .record-label{margin-top:12px;font-size:13.5px;color:var(--text-muted);}
  .timer{font-variant-numeric:tabular-nums;font-size:14px;margin-top:4px;color:var(--text);}

  section.block{margin:20px 0;}
  section.block h2{font-size:15px;margin-bottom:8px;}
  .transcript-box{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    font-size:14px;
    line-height:1.6;
    min-height:80px;
    white-space:pre-wrap;
  }
  .transcript-box.interim{color:var(--text-muted);}

  audio{width:100%;margin-top:8px;}

  .report{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
  }
  .report-head{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .report-title{font-family:Georgia,"Iowan Old Style",serif;font-size:16px;margin-bottom:8px;line-height:1.4;}
  .report-meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--text-muted);font-size:12.5px;}
  .report h4{font-size:14px;margin:16px 0 6px;color:var(--accent);font-family:Georgia,"Iowan Old Style",serif;font-weight:600;}
  .report h4:first-of-type{margin-top:0;}
  .report p{font-size:14px;line-height:1.55;margin:0 0 8px;}
  .report ul{margin:0 0 8px;padding-left:18px;font-size:14px;line-height:1.6;}
  .report-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:6px;}
  .table-scroll{overflow-x:auto;margin-bottom:6px;}
  .table-scroll .report-table{margin-bottom:0;min-width:420px;}
  .report-table th{text-align:left;color:var(--text-muted);font-weight:600;font-size:12px;padding:6px 8px 6px 0;border-bottom:1px solid var(--border);}
  .report-table td{padding:9px 8px 9px 0;border-bottom:1px solid var(--border);}
  .report-table tr:last-child td{border-bottom:none;}
  .stack-gap > *{margin-bottom:8px;}
  .stack-gap > *:last-child{margin-bottom:0;}
  .edit-action-row{margin-bottom:10px;}
  .edit-action-row .edit-action-tache{margin-bottom:6px;}
  .edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .edit-row input{flex:1;margin-bottom:0;}
  .row-remove{
    background:none;border:none;color:var(--text-muted);
    font-size:16px;cursor:pointer;padding:4px 8px;flex-shrink:0;
    font-family:inherit;
  }
  .row-remove:hover{color:var(--accent-live);}
  .edit-action-row .row-remove{margin-top:0;}
  .add-btn{margin-top:2px;padding:8px 14px;font-size:13px;width:auto;}

  .org-logo-placeholder{
    width:64px;height:64px;
    border-radius:14px;
    background:var(--bg-card);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:26px;
    color:var(--accent);
    flex-shrink:0;
  }
  .org-logo-img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;}

  .plan-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    text-align:center;
  }
  .plan-name{font-family:Georgia,"Iowan Old Style",serif;font-size:15px;color:var(--text-muted);}
  .plan-price{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:28px;
    color:var(--accent);
    margin-top:6px;
  }
  .plan-price span{font-size:13px;color:var(--text-muted);font-family:inherit;}

  .activity-list{background:var(--bg-card);border-radius:10px;padding:2px 16px;}
  .activity-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;
    border-bottom:1px solid var(--border);
    font-size:14.5px;
  }
  .activity-row:last-child{border-bottom:none;}
  .activity-value{font-family:Georgia,"Iowan Old Style",serif;font-size:19px;color:var(--accent);}
  .activity-row.warn .activity-value{color:var(--accent-live);}

  #print-area{display:none;}
  @media print{
    body > *:not(#print-area){display:none !important;}
    #print-area{
      display:block !important;
      color:#111;
      background:#fff;
      padding:0;
      font-family:Georgia,serif;
    }
    #print-area h1{font-size:20px;margin-bottom:4px;}
    #print-area h2{font-size:15px;margin:16px 0 6px;color:#111;}
    #print-area p, #print-area li{font-size:13px;line-height:1.5;color:#111;}
    #print-area table{border-collapse:collapse;width:100%;font-size:12.5px;}
    #print-area th, #print-area td{border:1px solid #333;padding:6px 8px;text-align:left;}
  }

  .notice{
    font-size:12.5px;
    color:var(--text-muted);
    line-height:1.5;
    padding:10px 12px;
    background:var(--bg-elevated);
    border-radius:8px;
    margin-top:10px;
  }
  .status-msg{font-size:13px;color:var(--accent);margin-top:8px;}
  .status-msg.error{color:var(--accent-live);}

  .install-banner{
    background:var(--bg-card);
    border:1px solid var(--accent);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .install-text{font-size:13px;line-height:1.5;margin-bottom:8px;}
  .install-row{display:flex;align-items:center;gap:10px;}
  .install-dismiss{background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;font-family:inherit;padding:8px 4px;}

  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .greeting{margin-bottom:2px;font-size:21px;}
  .subgreeting{color:var(--text-muted);font-size:13.5px;margin-bottom:20px;}

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .stat{
    background:var(--bg-card);
    border-radius:8px;
    padding:14px 14px 12px;
    border-left:3px solid var(--border);
  }
  .stat .icon{font-size:17px;}
  .stat .value{font-family:Georgia,"Iowan Old Style",serif;font-size:26px;line-height:1.2;margin-top:6px;}
  .stat .label{color:var(--text-muted);font-size:12px;margin-top:2px;}
  .stat.c-meetings{border-left-color:var(--accent-2);}
  .stat.c-decisions{border-left-color:var(--accent);}
  .stat.c-actions{border-left-color:var(--accent-3);}
  .stat.late{border-left-color:var(--accent-live);}
  .stat.late .value{color:var(--accent-live);}

  .org-banner{
    position:relative;
    height:118px;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:14px;
    background:linear-gradient(135deg, var(--bg-card), var(--bg-elevated));
  }
  .org-banner .banner-img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .org-banner .banner-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(22,35,42,0) 25%, rgba(22,35,42,0.88) 100%);
    display:flex; align-items:flex-end;
    gap:10px;
    padding:12px 14px;
  }
  .banner-logo{
    width:38px;height:38px;border-radius:10px;
    object-fit:cover;
    border:2px solid var(--bg);
    flex-shrink:0;
  }
  .banner-logo-placeholder{
    width:38px;height:38px;border-radius:10px;
    background:var(--accent);
    color:#20140A;
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:17px;
    flex-shrink:0;
    border:2px solid var(--bg);
  }
  .banner-org-name{
    color:#fff;
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:15.5px;
    font-weight:600;
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
  }

  .ticker{
    overflow:hidden;
    white-space:nowrap;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 0;
    margin-bottom:16px;
  }
  .ticker-track{
    display:inline-block;
    padding-left:100%;
    animation:ticker-scroll 24s linear infinite;
    font-size:12.5px;
    color:var(--text-muted);
  }
  .ticker-track span{margin-right:36px;}
  .ticker-track .hot{color:var(--accent-live);}
  @keyframes ticker-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .section-head h2{font-size:15px;}
  .section-head .see-all{
    font-size:12.5px;
    color:var(--text-muted);
    background:none;border:none;cursor:pointer;font-family:inherit;
  }

  .action-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .action-row:last-child{border-bottom:none;}
  .action-row .tache{flex:1;padding-right:10px;}
  .action-row .who-when{color:var(--text-muted);font-size:12.5px;white-space:nowrap;}

  .mini-card{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
    cursor:pointer;
  }
  .mini-card:last-child{border-bottom:none;}
  .mini-card .date{color:var(--text-muted);font-size:12.5px;white-space:nowrap;}

  .mode-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:16px 10px;
    font-size:14.5px;
    text-align:center;
  }
  .file-label{
    display:block;
    text-align:center;
    cursor:pointer;
  }

  .rec-screen{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
  }
  .rec-eyebrow{
    color:var(--text-muted);
    font-size:13px;
    letter-spacing:0.02em;
  }
  .rec-timer{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:52px;
    margin:10px 0 4px;

// Secret partagé entre l'app et l'outil de génération de code (privé, à

// jour aussi le générateur.
const ACTIVATION_SECRET = "RIA-AYH-2026";

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function verifyActivationCode(code, uid){
  const parts = code.trim().toUpperCase().split("-");
  if(parts.length !== 3) return null;
  const [planRaw, dateStr, checksum] = parts;
  const planId = planRaw === "MONTHLY" ? "monthly" : planRaw === "YEARLY" ? "yearly" : null;
  if(!planId || !/^\d{8}$/.test(dateStr)) return null;

  const shortUid = (uid || "").slice(0, 8).toUpperCase();
  const expectedFull = await sha256Hex(`${ACTIVATION_SECRET}:${shortUid}:${planRaw}:${dateStr}`);
  if(expectedFull.slice(0,8).toUpperCase() !== checksum) return null;

  const y = Number(dateStr.slice(0,4)), mo = Number(dateStr.slice(4,6))-1, d = Number(dateStr.slice(6,8));
  const expiresAt = new Date(y, mo, d, 23, 59, 59);
  return { planId, expiresAt };
}

// ---------- persistance locale (localStorage + IndexedDB pour l'audio) ----------
const STORAGE_KEY = "reunion-ia-state-v1";
const AUDIO_DB_NAME = "reunion-ia-audio";
const AUDIO_STORE = "audio";

function openAudioDB(){
  return new Promise((resolve, reject) => {
    if(!("indexedDB" in window)){ reject(new Error("IndexedDB indisponible")); return; }
    const req = indexedDB.open(AUDIO_DB_NAME, 1);
    req.onupgradeneeded = () => {
      if(!req.result.objectStoreNames.contains(AUDIO_STORE)) req.result.createObjectStore(AUDIO_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveAudioBlob(meetingId, blob){
  try{
    const db = await openAudioDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(AUDIO_STORE, "readwrite");
      tx.objectStore(AUDIO_STORE).put(blob, String(meetingId));
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.warn("Sauvegarde audio impossible :", e); }
}

async function loadAudioBlob(meetingId){
  try{
    const db = await openAudioDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(AUDIO_STORE, "readonly");
      const req = tx.objectStore(AUDIO_STORE).get(String(meetingId));
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}

async function deleteAudioBlob(meetingId){
  try{
    const db = await openAudioDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(AUDIO_STORE, "readwrite");
      tx.objectStore(AUDIO_STORE).delete(String(meetingId));
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ /* rien a supprimer */ }
}

async function clearAllAudioBlobs(){
  try{
    const db = await openAudioDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(AUDIO_STORE, "readwrite");
      tx.objectStore(AUDIO_STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ /* rien a supprimer */ }
}

let persistTimeout = null;
function persistState(){
  clearTimeout(persistTimeout);
  persistTimeout = setTimeout(() => {
    try{
      const data = {
        meetings: meetings.map(m => ({ ...m, audioURL: null, hasAudioBlob: !!m.audioURL })),
        idCounter, segIdCounter, partIdCounter, memberIdCounter, roleIdCounter, projectIdCounter,
        userName, organization, orgMembers, orgRoles, orgProjects, aiEndpoint,
        paymentEndpoint, deviceUid, subscription, pendingTransactionId
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }catch(e){ console.warn("Sauvegarde locale impossible :", e); }
  }, 250);
}

async function loadPersistedState(){
  let raw;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ return; }
  if(!raw) return;
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return; }

  meetings = (data.meetings || []).map(m => ({ ...m, date: new Date(m.date), audioURL: null }));
  idCounter = data.idCounter || 1;
  segIdCounter = data.segIdCounter || 1;
  partIdCounter = data.partIdCounter || 1;
  memberIdCounter = data.memberIdCounter || 1;
  roleIdCounter = data.roleIdCounter || 1;
  projectIdCounter = data.projectIdCounter || 1;
  userName = data.userName || userName;
  organization = data.organization || organization;
  orgMembers = data.orgMembers || [];
  orgRoles = data.orgRoles || [];
  orgProjects = data.orgProjects || [];
  aiEndpoint = data.aiEndpoint || "";
  paymentEndpoint = data.paymentEndpoint || "";
  deviceUid = data.deviceUid || "";
  subscription = data.subscription || { plan:"free", status:"active", expiresAt:null };
  pendingTransactionId = data.pendingTransactionId || null;

  const withAudio = meetings.filter(m => m.hasAudioBlob);
  for(const m of withAudio){
    const blob = await loadAudioBlob(m.id);
    if(blob) m.audioURL = URL.createObjectURL(blob);
  }
  if(withAudio.length) render();
}

function fmtDate(d){
  return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
function fmtReportDate(d){
  return d.toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
}
function fmtDuration(seconds){
  if(seconds === null || seconds === undefined || isNaN(seconds)) return null;
  const h = Math.floor(seconds/3600);
  const m = Math.round((seconds%3600)/60);
  if(h > 0) return `${h} h ${m.toString().padStart(2,"0")}`;
  if(m > 0) return `${m} min`;
  return "moins d'1 min";
}
function fmtTimer(s){
  const m = Math.floor(s/60).toString().padStart(2,"0");
  const sec = (s%60).toString().padStart(2,"0");
  return m+":"+sec;
}

function segmentsToText(segments){

const FR_MONTHS = {"janv":0,"févr":1,"fevr":1,"mars":2,"avr":3,"mai":4,"juin":5,"juil":6,"août":7,"aout":7,"sept":8,"oct":9,"nov":10,"déc":11,"dec":11};
function parseFrenchDate(str){
  if(!str) return null;
  const m = String(str).toLowerCase().match(/(\d{1,2})\s*([a-zéû]+)/i);
  if(!m) return null;
  const day = parseInt(m[1], 10);
  const monthKey = Object.keys(FR_MONTHS).find(k => m[2].startsWith(k));
  if(monthKey === undefined) return null;
  const now = new Date();
  const d = new Date(now.getFullYear(), FR_MONTHS[monthKey], day);
  return isNaN(d.getTime()) ? null : d;
}

function collectAllActions(){
  const list = [];
  meetings.forEach(m => {
    if(m.report && m.report.actions){
      m.report.actions.forEach((a,i) => list.push({ ...a, status: a.status || "a_faire", meetingId: m.id, meetingTitle: m.title, actionIndex: i }));
    }
  });
  return list;
}

function computeStats(){
  const actions = collectAllActions();
  const decisions = meetings.reduce((n, m) => n + (m.report && m.report.decisions ? m.report.decisions.length : 0), 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const late = actions.filter(a => {
    if(a.status === "termine") return false;
    const d = parseFrenchDate(a.echeance);
    return d && d < today;
  }).length;
  return { reunions: meetings.length, decisions, actions: actions.length, late };
}

function renderProcessingScreen(){
  if(processingStepIndex >= PROCESSING_STEPS.length){
    return `<div class="proc-screen"><div class="proc-ready">Compte rendu prêt <span class="proc-check">✓</span></div></div>`;
  }
  const rows = PROCESSING_STEPS.map((label, i) => {
    const icon = i < processingStepIndex ? "✓" : (i === processingStepIndex ? "●" : "○");
    const cls = i < processingStepIndex ? "done" : (i === processingStepIndex ? "current" : "");
    return `<div class="proc-row ${cls}"><span class="proc-icon">${icon}</span>${escapeHtml(label)}</div>`;
  }).join("");
  return `
    <div class="proc-screen">
      <div class="proc-title">Traitement de votre réunion</div>
      <div class="proc-list">${rows}</div>
    </div>
  `;
}

function cycleActionStatus(meetingId, actionIndex){
  const m = meetings.find(x => x.id === meetingId);
  if(!m || !m.report || !m.report.actions || !m.report.actions[actionIndex]) return;
  const a = m.report.actions[actionIndex];
  if(!a.status || a.status === "a_faire"){
    a.status = "en_cours";
    a.completedDate = null;
  }else if(a.status === "en_cours"){
    a.status = "termine";
    a.completedDate = new Date();
  }else{
    a.status = "a_faire";
    a.completedDate = null;
  }
  render();
}

    if(a.status === "termine"){
      metaBits.push(a.completedDate ? "Terminé le " + escapeHtml(fmtReportDate(new Date(a.completedDate))) : "Terminé");
    }else if(a.echeance){
      metaBits.push(escapeHtml(a.echeance));

    metaBits.push(escapeHtml(a.meetingTitle));
    return `

function computeOrgActivity(){
  const currentMonthKey = monthKeyOf(new Date());
  const reunionsCeMois = meetings.filter(m => monthKeyOf(m.date) === currentMonthKey).length;
  const actions = collectAllActions();
  const decisions = meetings.reduce((n, m) => n + (m.report && m.report.decisions ? m.report.decisions.length : 0), 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const done = actions.filter(a => a.status === "termine").length;
  const late = actions.filter(a => {
    if(a.status === "termine") return false;
    const d = parseFrenchDate(a.echeance);
    return d && d < today;
  }).length;
  return { reunionsCeMois, decisions, actions: actions.length, done, late };
}

async function subscribeToPlan(planId){
  subscriptionError = "";
  if(!paymentEndpoint){
    subscriptionError = "Configure d'abord l'URL du service de paiement ci-dessus.";
    render();
    return;
  }
  const phone = window.prompt("Numéro Mobile Money (Flooz/T-Money) pour le paiement :");
  if(!phone) return;

  subscriptionChecking = true;
  render();

  try{
    const response = await fetch(paymentEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action:"initiate", uid: deviceUid, planId, phone })
    });
    const data = await response.json();
    if(!response.ok || data.error) throw new Error(data.error || "Le service de paiement a renvoyé une erreur.");

    pendingTransactionId = data.transactionId;
    subscription = { plan: planId, amount: planId === "yearly" ? 20000 : 2000, status:"pending", expiresAt:null };
    subscriptionChecking = false;
    render();

    if(data.paymentUrl) window.open(data.paymentUrl, "_blank");
  }catch(e){
    subscriptionChecking = false;
    subscriptionError = "Impossible de démarrer le paiement : " + e.message;
    render();
  }
}

async function checkMyPayment(){
  if(!pendingTransactionId || !paymentEndpoint) return;
  subscriptionChecking = true;
  subscriptionError = "";
  render();

  try{
    const response = await fetch(paymentEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action:"status", transactionId: pendingTransactionId })
    });
    const data = await response.json();
    if(!response.ok || data.error) throw new Error(data.error || "Vérification impossible.");

    if(data.status === "confirmed"){
      const days = subscription.plan === "yearly" ? 365 : 30;
      subscription = { ...subscription, status:"active", expiresAt: new Date(Date.now() + days*24*60*60*1000).toISOString() };
      pendingTransactionId = null;
    }else if(data.status === "failed"){
      subscriptionError = "Le paiement a échoué ou a été annulé. Réessaie.";
      pendingTransactionId = null;
    }else{
      subscriptionError = "Paiement encore en attente — réessaie dans un instant si tu viens de payer.";
    }
  }catch(e){
    subscriptionError = "Impossible de vérifier le paiement : " + e.message;
  }
  subscriptionChecking = false;
  render();
}

let filterMonth = "all";
let filterType = "all";
let filterPerson = "";
let filterSearch = "";

function capitalizeFirst(s){
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function monthKeyOf(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

function getAvailableMonths(){
  const map = new Map();
  meetings.forEach(m => {
    const key = monthKeyOf(m.date);
    if(!map.has(key)) map.set(key, m.date.toLocaleDateString("fr-FR", { month:"long", year:"numeric" }));
  });
  return Array.from(map.entries()).sort((a,b) => b[0].localeCompare(a[0]));
}

function meetingMatchesFilters(m){
  if(filterMonth !== "all" && monthKeyOf(m.date) !== filterMonth) return false;
  if(filterType !== "all" && m.type !== filterType) return false;
  if(filterProject !== "all" && String(m.projectId||"") !== filterProject) return false;
  if(filterPerson.trim()){
    const q = filterPerson.trim().toLowerCase();
    const inParticipants = (m.participants||[]).some(p => (p.name||"").toLowerCase().includes(q));
    const inResponsables = (m.report && m.report.actions ? m.report.actions : []).some(a => (a.responsable||"").toLowerCase().includes(q));
    if(!inParticipants && !inResponsables) return false;
  }
  if(filterSearch.trim()){
    const q = filterSearch.trim().toLowerCase();
    const hay = [
      m.title,
      m.report ? m.report.resume : "",
      ...(m.report ? (m.report.decisions||[]) : []),
      ...(m.report ? (m.report.points_abordes||[]) : [])
    ].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function groupMeetingsByMonth(list){
  const map = new Map();
  list.forEach(m => {
    const key = monthKeyOf(m.date);
    if(!map.has(key)) map.set(key, { label: m.date.toLocaleDateString("fr-FR", { month:"long", year:"numeric" }), items: [] });
    map.get(key).items.push(m);
  });
  return Array.from(map.entries()).sort((a,b) => b[0].localeCompare(a[0])).map(([,v]) => v);
}

function statusIconLabel(m){
  if(m.status === "termine") return "✓ Compte rendu";
  return statusLabel(m.status);
}

function buildMeetingGroupsHTML(){
  const filtered = meetings.filter(meetingMatchesFilters);
  const grouped = groupMeetingsByMonth(filtered.slice().reverse());
  return grouped.length ? grouped.map(g => `
    <div class="month-group">
      <div class="month-label">${escapeHtml(capitalizeFirst(g.label))}</div>
      ${g.items.map(m => `
        <div class="card status-${m.status}" data-open="${m.id}">
          <div class="card-date">${m.date.toLocaleDateString("fr-FR", { day:"2-digit" })}<br>${m.date.toLocaleDateString("fr-FR", { month:"short" })}</div>
          <div class="card-body">
            <h3>${escapeHtml(m.title)}</h3>
            <div class="meta">${m.type ? escapeHtml(m.type)+" · " : ""}${statusIconLabel(m)}</div>
          </div>
          <button class="card-delete" data-delete-meeting-id="${m.id}" aria-label="Supprimer">🗑️</button>
        </div>
      `).join("")}
    </div>
  `).join("") : `<div class="empty">Aucune réunion ne correspond à ces filtres.</div>`;
}

function safeFileName(title){
  const base = (title||"reunion").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  return (base || "reunion").slice(0,60);
}

// ---------- export de la transcription, mise en forme par intervenant ----------
function groupSegmentsBySpeakerRun(segments){
  const groups = [];
  (segments||[]).forEach(s => {
    const speaker = s.speaker || "";
    const last = groups[groups.length-1];
    if(last && last.speaker === speaker){
      last.text = (last.text + " " + (s.text||"")).trim();
    }else{
      groups.push({ speaker, startTime: s.time || "", text: (s.text||"").trim() });
    }
  });
  return groups;
}

function buildTranscriptPlainText(m){
  const groups = groupSegmentsBySpeakerRun(m.segments);
  const lines = [];
  lines.push(`Transcription — ${m.title}`);
  lines.push(fmtReportDate(m.date));
  lines.push("");
  if(!groups.length) lines.push("(Aucune transcription enregistrée.)");
  groups.forEach(g => {
    const who = g.speaker || "Intervenant";
    lines.push(`${who}${g.startTime ? " ("+g.startTime+")" : ""}`);
    lines.push(g.text);
    lines.push("");
  });
  return lines.join("\n").trim();
}

function buildTranscriptHTMLBody(m){
  const groups = groupSegmentsBySpeakerRun(m.segments);
  const blocks = groups.length ? groups.map(g => `
    <p><strong>${escapeHtml(g.speaker || "Intervenant")}</strong>${g.startTime ? ` <span style="color:#666;font-size:12px;">(${escapeHtml(g.startTime)})</span>` : ""}<br>${escapeHtml(g.text)}</p>
  `).join("") : `<p>(Aucune transcription enregistrée.)</p>`;

  return `
    <h1>Transcription — ${escapeHtml(m.title)}</h1>
    <p>${escapeHtml(fmtReportDate(m.date))}</p>
    ${blocks}
  `;
}

function actionStatusLabel(a){
  const status = a.status || "a_faire";
  if(status === "termine") return a.completedDate ? "Terminé le " + fmtReportDate(new Date(a.completedDate)) : "Terminé";
  if(status === "en_cours") return "En cours";
  return "À faire";
}

function buildReportPlainText(m){
  const r = m.report;
  const lines = [];
  lines.push(`Compte rendu — ${m.title}`);
  const metaParts = [fmtReportDate(m.date)];
  const dur = fmtDuration(m.durationSeconds);
  if(dur) metaParts.push(dur);
  const pc1 = getParticipantCount(m); if(pc1) metaParts.push(pc1 + " participant" + (pc1>1?"s":""));
  lines.push(metaParts.join(" · "));
  lines.push("");
  lines.push("Résumé");
  lines.push(r.resume || "");
  if((r.points_abordes||[]).length){
    lines.push(""); lines.push("Points abordés");
    r.points_abordes.forEach(p => lines.push("- " + p));
  }
  if((r.decisions||[]).length){
    lines.push(""); lines.push("Décisions prises");
    r.decisions.forEach(d => lines.push("- " + d));
  }
  if((r.actions||[]).length){
    lines.push(""); lines.push("Actions");
    r.actions.forEach(a => lines.push(`- ${a.tache} — Responsable : ${a.responsable||"—"} — Échéance : ${a.echeance||"—"} — Statut : ${actionStatusLabel(a)}`));
  }
  if((r.questions||[]).length){
    lines.push(""); lines.push("Questions non résolues");
    r.questions.forEach(q => lines.push("- " + q));
  }
  if(r.prochaine_reunion){
    lines.push(""); lines.push("Prochaine réunion");
    lines.push(r.prochaine_reunion);
  }
  return lines.join("\n");
}

function buildReportHTMLBody(m){
  const r = m.report;
  const dur = fmtDuration(m.durationSeconds);
  const metaParts = [fmtReportDate(m.date)];
  if(dur) metaParts.push(dur);
  const pc1 = getParticipantCount(m); if(pc1) metaParts.push(pc1 + " participant" + (pc1>1?"s":""));
  const li = arr => arr.map(x => `<li>${escapeHtml(x)}</li>`).join("");

  return `
    <h1>Compte rendu — ${escapeHtml(m.title)}</h1>
    <p>${escapeHtml(metaParts.join(" · "))}</p>
    <h2>Résumé</h2>
    <p>${escapeHtml(r.resume||"")}</p>
    ${(r.points_abordes||[]).length ? `<h2>Points abordés</h2><ul>${li(r.points_abordes)}</ul>` : ""}
    ${(r.decisions||[]).length ? `<h2>Décisions prises</h2><ul>${li(r.decisions)}</ul>` : ""}
    ${(r.actions||[]).length ? `<h2>Actions</h2>
      <table>
        <tr><th>Action</th><th>Responsable</th><th>Échéance</th><th>Statut</th></tr>
        ${r.actions.map(a => `<tr><td>${escapeHtml(a.tache||"")}</td><td>${escapeHtml(a.responsable||"—")}</td><td>${escapeHtml(a.echeance||"—")}</td><td>${escapeHtml(actionStatusLabel(a))}</td></tr>`).join("")}
      </table>` : ""}
    ${(r.questions||[]).length ? `<h2>Questions non résolues</h2><ul>${li(r.questions)}</ul>` : ""}
    ${r.prochaine_reunion ? `<h2>Prochaine réunion</h2><p>${escapeHtml(r.prochaine_reunion)}</p>` : ""}
  `;
}

function commitReportEditFromDOM(m, finalize){
  const titleInput = document.getElementById("edit-report-title");
  const dateInput = document.getElementById("edit-report-date");
  const resumeInput = document.getElementById("edit-report-resume");
  const nextInput = document.getElementById("edit-report-next");

  if(titleInput && titleInput.value.trim()) m.title = titleInput.value.trim();
  if(dateInput && dateInput.value){
    const [y, mo, da] = dateInput.value.split("-").map(Number);
    const newDate = new Date(m.date);
    newDate.setFullYear(y, mo-1, da);
    m.date = newDate;
  }
  if(resumeInput) m.report.resume = resumeInput.value;

  let points = Array.from(document.querySelectorAll(".edit-point")).map(el => el.value);
  let decisions = Array.from(document.querySelectorAll(".edit-decision")).map(el => el.value);
  let questions = Array.from(document.querySelectorAll(".edit-question")).map(el => el.value);
  const oldActions = m.report.actions || [];
  let actions = Array.from(document.querySelectorAll(".edit-action-row")).map((row, i) => ({
    tache: row.querySelector(".edit-action-tache")?.value || "",
    responsable: row.querySelector(".edit-action-resp")?.value || "",
    echeance: row.querySelector(".edit-action-ech")?.value || "",
    status: (oldActions[i] && oldActions[i].status) || "a_faire",
    completedDate: (oldActions[i] && oldActions[i].completedDate) || null
  }));

  if(finalize){
    points = points.filter(v => v.trim());
    decisions = decisions.filter(v => v.trim());
    questions = questions.filter(v => v.trim());
    actions = actions.filter(a => a.tache.trim());
  }

  m.report.points_abordes = points;
  m.report.decisions = decisions;
  m.report.questions = questions;
  m.report.actions = actions;
  if(nextInput) m.report.prochaine_reunion = nextInput.value.trim();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function bindEvents(){
  const app = document.getElementById("app");

  const newBtn = app.querySelector("[data-new]");
  if(newBtn) newBtn.onclick = () => { view = "new"; render(); };

  app.querySelectorAll("[data-save-settings]").forEach(btn => {

      if(endpointInput) aiEndpoint = endpointInput.value.trim();
      settingsSaved = true;
      render();
    };
  });

  if(installBtn) installBtn.onclick = () => triggerInstall();

  if(dismissInstallBtn) dismissInstallBtn.onclick = () => { installBannerDismissed = true; render(); };

  const resetDataBtn = app.querySelector("[data-reset-data]");
  if(resetDataBtn) resetDataBtn.onclick = () => {
    if(window.confirm("Effacer toutes les données de l'application (réunions, organisation, membres...) ? Cette action est irréversible.")){
      meetings = [];
      settingsSaved = false;
      clearAllAudioBlobs();
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      view = "dashboard";
      render();
    }
  };

  const openMembersBtn = app.querySelector("[data-open-members]");
  if(openMembersBtn) openMembersBtn.onclick = () => { membersSaved = false; view = "members"; render(); };

  const openOrganizationBtn = app.querySelector("[data-open-organization]");
  if(openOrganizationBtn) openOrganizationBtn.onclick = () => { organizationSaved = false; view = "organization"; render(); };

  const openSubscriptionBtn = app.querySelector("[data-open-subscription]");
  if(openSubscriptionBtn) openSubscriptionBtn.onclick = () => { subscriptionError = ""; view = "subscription"; render(); };

  const savePaymentEndpointBtn = app.querySelector("[data-save-payment-endpoint]");
  if(savePaymentEndpointBtn) savePaymentEndpointBtn.onclick = () => {
    const input = document.getElementById("settings-payment-endpoint");
    if(input) paymentEndpoint = input.value.trim();
    render();
  };

  app.querySelectorAll("[data-subscribe]").forEach(btn => {
    btn.onclick = () => subscribeToPlan(btn.dataset.subscribe);
  });

  const checkPaymentBtn = app.querySelector("[data-check-payment]");
  if(checkPaymentBtn) checkPaymentBtn.onclick = () => checkMyPayment();

  const copyDeviceCodeBtn = app.querySelector("[data-copy-device-code]");
  if(copyDeviceCodeBtn) copyDeviceCodeBtn.onclick = async () => {
    const shortCode = (deviceUid || "").slice(0,8).toUpperCase();
    try{ await navigator.clipboard.writeText(shortCode); activationSuccessMsg = "Code copié ✓"; }
    catch(e){ activationSuccessMsg = ""; }
    render();
  };

  const activateCodeBtn = app.querySelector("[data-activate-code]");
  if(activateCodeBtn) activateCodeBtn.onclick = async () => {
    const input = document.getElementById("activation-code-input");
    const code = input ? input.value : "";
    subscriptionError = "";
    activationSuccessMsg = "";
    if(!code.trim()){
      subscriptionError = "Entre le code reçu.";
      render();
      return;
    }
    subscriptionChecking = true;
    render();
    const result = await verifyActivationCode(code, deviceUid);
    subscriptionChecking = false;
    if(!result){
      subscriptionError = "Code invalide. Vérifie qu'il est bien recopié tel quel.";
      render();
      return;
    }
    subscription = {
      plan: result.planId,
      amount: result.planId === "yearly" ? 20000 : 2000,
      status: "active",
      expiresAt: result.expiresAt.toISOString()
    };
    pendingTransactionId = null;
    activationSuccessMsg = "Abonnement activé ✓";
    render();

    render();

// ---------- recording + live transcription ----------
function startTimer(){
  timerInterval = setInterval(() => {
    secondsElapsed++;
    const t = document.querySelector(".rec-timer");
    if(t) t.textContent = fmtTimer(secondsElapsed);
  }, 1000);
}
function stopTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

function startRecognition(m){
  if(!speechSupported) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "fr-FR";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = (e) => {
    let finalChunk = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i];
      if(res.isFinal) finalChunk += res[0].transcript + " ";
    }
    finalChunk = finalChunk.trim();
    if(finalChunk){
      m.segments = m.segments || [];
      m.segments.push({ id: segIdCounter++, time: fmtTimer(secondsElapsed), speaker: "", text: finalChunk });
      m.transcript = segmentsToText(m.segments);
    }
  };
  recognition.onerror = () => {};
  recognition.start();
}
function stopRecognition(){
  if(recognition){ try{ recognition.stop(); }catch(e){} recognition = null; }
}

// ---------- transcription d'un fichier importé, via micro + lecture ----------
function startImportRecognition(m, audioEl){
  if(!speechSupported) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "fr-FR";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = (e) => {
    let finalChunk = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i];
      if(res.isFinal) finalChunk += res[0].transcript + " ";
    }
    finalChunk = finalChunk.trim();
    if(finalChunk){
      m.segments = m.segments || [];
      m.segments.push({ id: segIdCounter++, time: fmtTimer(Math.floor(audioEl.currentTime||0)), speaker: "", text: finalChunk });
      m.transcript = segmentsToText(m.segments);
    }
  };
  recognition.onerror = () => {};
  recognition.start();
}

async function startImportTranscription(){
  const m = meetings.find(x => x.id === currentId);
  const audioEl = document.getElementById("import-audio-player");
  if(!m || !audioEl || !speechSupported) return;

  try{
    await navigator.mediaDevices.getUserMedia({ audio:true });
  }catch(e){
    reportError = "Impossible d'accéder au micro : vérifie les autorisations de l'application.";

  }

  transcribingImport = true;
  startImportRecognition(m, audioEl);
  audioEl.currentTime = 0;

// ---------- transcription fiable via un service en ligne (Whisper ou equivalent) ----------
// ---------- transcription en ligne, découpée en séquences pour les longs enregistrements ----------
const TRANSCRIBE_CHUNK_SECONDS = 300; // 5 minutes par séquence

function writeWavString(view, offset, str){
  for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i));
}

function interleaveChannels(left, right){
  const length = left.length + right.length;
  const result = new Float32Array(length);
  let index = 0, inputIndex = 0;
  while(index < length){
    result[index++] = left[inputIndex];
    result[index++] = right[inputIndex];
    inputIndex++;
  }
  return result;
}

function floatTo16BitPCM(view, offset, input){
  for(let i=0;i<input.length;i++, offset+=2){
    const s = Math.max(-1, Math.min(1, input[i]));
    view.setInt16(offset, s < 0 ? s*0x8000 : s*0x7FFF, true);
  }
}

function audioBufferToWavBlob(buffer){
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const bitDepth = 16;
  const samples = numChannels === 2
    ? interleaveChannels(buffer.getChannelData(0), buffer.getChannelData(1))
    : buffer.getChannelData(0);

  const dataLength = samples.length * (bitDepth/8);
  const arrayBuffer = new ArrayBuffer(44 + dataLength);
  const view = new DataView(arrayBuffer);

  writeWavString(view, 0, "RIFF");
  view.setUint32(4, 36 + dataLength, true);
  writeWavString(view, 8, "WAVE");
  writeWavString(view, 12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * (bitDepth/8), true);
  view.setUint16(32, numChannels * (bitDepth/8), true);
  view.setUint16(34, bitDepth, true);
  writeWavString(view, 36, "data");
  view.setUint32(40, dataLength, true);
  floatTo16BitPCM(view, 44, samples);

  return new Blob([arrayBuffer], { type:"audio/wav" });
}

function sliceAudioBuffer(buffer, startSec, endSec, ctx){
  const sampleRate = buffer.sampleRate;
  const startSample = Math.floor(startSec*sampleRate);
  const endSample = Math.min(buffer.length, Math.floor(endSec*sampleRate));
  const frameCount = Math.max(1, endSample - startSample);
  const newBuffer = ctx.createBuffer(buffer.numberOfChannels, frameCount, sampleRate);
  for(let ch=0; ch<buffer.numberOfChannels; ch++){
    newBuffer.copyToChannel(buffer.getChannelData(ch).subarray(startSample, endSample), ch, 0);
  }
  return newBuffer;
}

// Ramène chaque séquence à 16 kHz mono avant l'envoi : c'est la résolution
// native de Whisper, et ça divise la taille du fichier par 3 environ par
// rapport à l'audio brut du micro (souvent 48 kHz) — indispensable pour
// rester sous la limite de taille du service en ligne.
async function resampleBufferMono16k(buffer){
  const targetRate = 16000;
  const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const offlineCtx = new OfflineCtx(1, Math.max(1, Math.ceil(buffer.duration * targetRate)), targetRate);
  const source = offlineCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(offlineCtx.destination);
  source.start(0);
  return await offlineCtx.startRendering();
}

async function sendChunkToAi(blob, contentType){
  let resp;
  try{
    resp = await fetch(aiEndpoint, {
      method:"POST",
      headers: { "Content-Type": contentType },
      body: blob
    });
  }catch(networkErr){
    throw new Error("Impossible de joindre le service (réseau ou CORS) : " + networkErr.message);
  }

  const rawText = await resp.text();
  let data;
  try{
    data = JSON.parse(rawText);
  }catch(parseErr){
    throw new Error(`Réponse invalide du service (HTTP ${resp.status}) : ${rawText.slice(0, 200) || "(réponse vide)"}`);
  }

  if(!resp.ok || data.error){
    const parts = [];
    if(data.error) parts.push(typeof data.error === "string" ? data.error : JSON.stringify(data.error));
    if(data.details) parts.push(typeof data.details === "string" ? data.details : JSON.stringify(data.details));
    throw new Error(`HTTP ${resp.status}${parts.length ? " : " + parts.join(" — ") : ""}`);
  }
  return (data.text || "").trim();
}

async function transcribeAudioFile(){
  const m = meetings.find(x => x.id === currentId);
  if(!m || !m.audioURL) return;
  if(!aiEndpoint){
    reportError = "Configure d'abord l'URL du service de transcription dans Réglages.";
    render();
    return;
  }

  fileTranscribing = true;
  reportError = "";
  transcribeProgress = "Préparation…";
  render();

  const audioBlob = await (await fetch(m.audioURL)).blob();
  let anyText = false;

  try{
    const arrayBuffer = await audioBlob.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    let audioBuffer;
    try{
      audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    }catch(decodeErr){
      audioCtx.close();
      // Repli : le navigateur n'a pas su décoder ce format, on envoie le fichier tel quel (ok pour un fichier court)
      transcribeProgress = "";
      const text = await sendChunkToAi(audioBlob, audioBlob.type || "application/octet-stream");
      m.segments = m.segments || [];
      m.segments.push({ id: segIdCounter++, time: "00:00", speaker: "", text: text || "[Passage inaudible ou silencieux]" });
      m.transcript = segmentsToText(m.segments);
      anyText = true;
      if(!anyText) reportError = "Le service n'a renvoyé aucun texte.";
      fileTranscribing = false;
      transcribeProgress = "";
      render();
      return;
    }

    const totalDuration = audioBuffer.duration;
    const numChunks = Math.max(1, Math.ceil(totalDuration / TRANSCRIBE_CHUNK_SECONDS));

    for(let i=0; i<numChunks; i++){
      transcribeProgress = numChunks > 1 ? `Séquence ${i+1}/${numChunks}…` : "Transcription en cours…";
      render();

      const startSec = i * TRANSCRIBE_CHUNK_SECONDS;
      const endSec = Math.min(totalDuration, startSec + TRANSCRIBE_CHUNK_SECONDS);
      const chunkBuffer = sliceAudioBuffer(audioBuffer, startSec, endSec, audioCtx);
      const resampledBuffer = await resampleBufferMono16k(chunkBuffer);
      const wavBlob = audioBufferToWavBlob(resampledBuffer);

      let text;
      try{
        text = await sendChunkToAi(wavBlob, "audio/wav");
      }catch(chunkErr){
        throw new Error(`Séquence ${i+1}/${numChunks} : ${chunkErr.message}`);
      }

      m.segments = m.segments || [];
      m.segments.push({ id: segIdCounter++, time: fmtTimer(Math.floor(startSec)), speaker: "", text: text || "[Passage inaudible ou silencieux]" });
      m.transcript = segmentsToText(m.segments);
      anyText = true;
    }
    audioCtx.close();

    if(!anyText) reportError = "Le service n'a renvoyé aucun texte.";
  }catch(e){
    reportError = "La transcription via le service en ligne a échoué : " + e.message +
      (anyText ? " (les séquences déjà transcrites ont été conservées)" : "");
  }

  fileTranscribing = false;
  transcribeProgress = "";
  render();
}

function pickBestRecordingMimeType(){
  const candidates = [
    "audio/mp4",
    "audio/webm;codecs=opus",
    "audio/ogg;codecs=opus",
    "audio/webm"
  ];
  if(typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return null;
  return candidates.find(t => MediaRecorder.isTypeSupported(t)) || null;
}

async function startRecordingSession(){
  const m = meetings.find(x => x.id === currentId);
  reportError = "";
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    audioChunks = [];
    const mimeType = pickBestRecordingMimeType();
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    const recordedType = mediaRecorder.mimeType || mimeType || "audio/webm";
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: recordedType });
      m.audioURL = URL.createObjectURL(blob);
      m.audioMimeType = recordedType;
      m.hasAudioBlob = true;
      saveAudioBlob(m.id, blob);
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();

    secondsElapsed = 0;
    startTimer();
    startRecognition(m);

    recordingSessionActive = true;
    paused = false;
    confirmingEnd = false;
    m.status = "enregistrement";
    render();
  }catch(err){
    reportError = "Impossible d'accéder au micro : vérifie les autorisations de l'application.";
    render();
  }
}

function togglePause(){
  const m = meetings.find(x => x.id === currentId);
  if(!paused){
    if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.pause();
    stopRecognition();
    stopTimer();
    paused = true;
  }else{
    if(mediaRecorder && mediaRecorder.state === "paused") mediaRecorder.resume();
    startRecognition(m);
    startTimer();
    paused = false;
  }
  render();
}

function clickTerminer(){
  if(!paused){
    if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.pause();
    stopRecognition();
    stopTimer();
    paused = true;
  }
  confirmingEnd = true;
  render();
}

function cancelEnd(){
  const m = meetings.find(x => x.id === currentId);
  confirmingEnd = false;
  if(mediaRecorder && mediaRecorder.state === "paused") mediaRecorder.resume();
  startRecognition(m);
  startTimer();
  paused = false;
  render();
}

function deleteMeeting(id){
  if(!window.confirm("Supprimer définitivement cette réunion ? Le compte rendu, la transcription et l'audio associés seront perdus.")) return;
  deleteAudioBlob(id);
  meetings = meetings.filter(x => x.id !== id);
  if(currentId === id){
    currentId = null;
    view = "list";
  }
  render();
}

function discardRecording(){
  if(!window.confirm("Annuler cet enregistrement ? L'audio et la transcription seront perdus, sans possibilité de retour en arrière.")) return;
  const m = meetings.find(x => x.id === currentId);
  if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  stopRecognition();
  stopTimer();
  recordingSessionActive = false;
  paused = false;
  confirmingEnd = false;
  if(m){
    m.audioURL = null;
    m.hasAudioBlob = false;
    deleteAudioBlob(m.id);
    m.segments = [];
    m.transcript = "";
    m.durationSeconds = null;
    m.status = "brouillon";
  }
  render();
}

function finalizeAndGenerate(){
  const m = meetings.find(x => x.id === currentId);
  if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  stopRecognition();
  stopTimer();
  if(m) m.durationSeconds = secondsElapsed;
  recordingSessionActive = false;
  paused = false;
  confirmingEnd = false;
  render();
  generateReport();
}

function resetAudio(m){
  const msg = m.entryMode === "record"
    ? "Réinitialiser l'enregistrement ? L'audio, la transcription et le compte rendu de cette réunion seront supprimés."
    : "Réinitialiser l'audio importé ? Le fichier audio et le compte rendu seront supprimés (la transcription déjà saisie sera conservée).";
  if(!window.confirm(msg)) return;

  if(transcribingImport) stopImportTranscription();

  m.audioURL = null;
  m.hasAudioBlob = false;
  deleteAudioBlob(m.id);
  m.audioFileName = null;
  m.durationSeconds = null;
  m.status = "brouillon";
  m.report = null;
  if(m.entryMode === "record"){
    m.segments = [];
    m.transcript = "";
  }
  reportError = "";
  render();
}

function abortRecordingIfActive(){
  if(recordingSessionActive){
    if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    stopRecognition();
    stopTimer();
    recordingSessionActive = false;
    paused = false;
    confirmingEnd = false;
  }
}

// ---------- AI report generation ----------
function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

// ---------- appel générique au service IA (texte) ----------
async function callAiService({ system, messages, max_tokens }){
  if(!aiEndpoint){
    throw new Error("Aucun service IA configuré. Va dans Réglages → Service IA pour en configurer un.");
  }

  let response;
  try{
    response = await fetch(aiEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system, messages, max_tokens: max_tokens || 1000 })
    });
  }catch(networkErr){
    throw new Error("Impossible de joindre le service IA (réseau, CORS, ou URL incorrecte) : " + networkErr.message);
  }

  const rawText = await response.text();
  let data;
  try{
    data = JSON.parse(rawText);
  }catch(parseErr){
    throw new Error(`Réponse invalide du service (HTTP ${response.status}) : ${rawText.slice(0, 200) || "(réponse vide)"}`);
  }

  if(!response.ok || data.error){
    const parts = [];
    if(data.error) parts.push(typeof data.error === "string" ? data.error : JSON.stringify(data.error));
    if(data.details) parts.push(typeof data.details === "string" ? data.details : JSON.stringify(data.details));
    const detail = parts.join(" — ");
    throw new Error(`Le service IA a renvoyé une erreur (HTTP ${response.status})${detail ? " : " + detail : ""}`);
  }
  const text = typeof data.text === "string" ? data.text : JSON.stringify(data.text ?? "");
  return text.trim();
}

function extractJsonObject(text){
  const clean = text.replace(/```json|```/g, "").trim();
  const match = clean.match(/\{[\s\S]*\}/);
  const jsonStr = match ? match[0] : clean;
  return JSON.parse(jsonStr);
}

async function callReportAPI(transcript){
  const membersContext = orgMembers.length
    ? `\nMembres connus de l'organisation (utilise ces noms et rôles pour mieux attribuer les actions et corriger d'éventuelles erreurs de transcription sur les noms) :\n${orgMembers.map(mem => `- ${mem.name}${mem.role ? " (" + mem.role + ")" : ""}`).join("\n")}\n`
    : "";

  const prompt = `Tu es un assistant qui rédige des comptes rendus de réunion structurés en français.
À partir de la transcription ci-dessous, réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans balises markdown, au format exact :
{"resume": "un résumé clair en 2-4 phrases", "points_abordes": ["sujet 1", "sujet 2"], "decisions": ["décision 1", "décision 2"], "actions": [{"tache": "description de la tâche", "responsable": "nom ou rôle si mentionné, sinon vide", "echeance": "délai si mentionné, sinon vide"}], "questions": ["question restée sans réponse"], "prochaine_reunion": "date ou texte si une prochaine réunion est mentionnée, sinon chaîne vide"}
Laisse un tableau vide si une catégorie n'est pas présente dans la transcription. N'invente rien qui ne soit pas dans la transcription.
${membersContext}
Transcription :
"""${transcript}"""`;

  const text = await callAiService({ messages: [{ role:"user", content: prompt }], max_tokens: 1000 });
  return extractJsonObject(text);
}

function buildMemoryCorpus(){
  return meetings.map(m => {
    const entry = { id: m.id, titre: m.title, date: fmtReportDate(m.date) };
    if(m.report){
      entry.resume = m.report.resume || "";
      entry.decisions = m.report.decisions || [];
      entry.points_abordes = m.report.points_abordes || [];
      entry.prochaine_reunion = m.report.prochaine_reunion || "";
    }else{
      const t = getMeetingTranscriptText(m);
      entry.extrait_transcription = t ? t.slice(0, 600) : "";
    }
    return entry;
  });
}

async function callMemoryAPI(question){
  const corpus = buildMemoryCorpus();
  const membersContext = orgMembers.length
    ? `\nMembres connus de l'organisation :\n${orgMembers.map(mem => `- ${mem.name}${mem.role ? " (" + mem.role + ")" : ""}`).join("\n")}\n`
    : "";
  const prompt = `Tu es la mémoire d'une organisation, construite à partir des comptes rendus de ses réunions passées.
On te donne la liste des réunions enregistrées (au format JSON) et une question posée par un membre de l'organisation.
Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans balises markdown, au format exact :
{"reponse": "réponse synthétique, une information par ligne séparée par un retour à la ligne, en citant la date de chaque réunion concernée ; termine si pertinent par une ligne 'Dernière décision connue : ...'", "reunions_utilisees": [id1, id2]}
N'invente rien qui ne soit pas dans les réunions fournies. Si aucune réunion ne permet de répondre, renvoie {"reponse": "Aucune information trouvée dans les réunions enregistrées à ce sujet.", "reunions_utilisees": []}.
${membersContext}
Réunions :
${JSON.stringify(corpus)}

Question : "${question}"`;

  const text = await callAiService({ messages: [{ role:"user", content: prompt }], max_tokens: 1000 });
  return extractJsonObject(text);
}

async function askMemory(){
  const input = document.getElementById("memory-question");
  const question = (input?.value || memoryQuery || "").trim();
  memoryError = "";

  if(!question){
    memoryError = "Écris une question pour interroger la mémoire.";
    render();
    return;
  }
  if(!meetings.length){
    memoryError = "Aucune réunion enregistrée pour l'instant.";
    render();
    return;
  }
  if(!aiEndpoint){
    memoryError = "Aucun service IA configuré — va dans Réglages → 🌐 Service IA pour en configurer un.";
    render();
    return;
  }

  memoryQuery = question;
  memoryLoading = true;
  memoryAnswer = null;
  showMemorySources = false;
  render();

  try{
    memoryAnswer = await callMemoryAPI(question);
  }catch(e){
    memoryError = "La recherche dans la mémoire a échoué" + (e.message ? " : " + e.message : ". Réessaie dans un instant.");
  }
  memoryLoading = false;
  render();
}

async function generateReport(){
  const m = meetings.find(x => x.id === currentId);
  const transcript = getMeetingTranscriptText(m).trim();
  reportError = "";
  editingReport = false;

  if(!transcript){
    reportError = "Ajoute d'abord une transcription (enregistre la réunion ou saisis le texte manuellement).";
    render();
    return;
  }
  if(!aiEndpoint){
    reportError = "Aucun service IA configuré — va dans Réglages → 🌐 Service IA pour en configurer un (obligatoire une fois l'app déployée en dehors de Claude).";
    render();
    return;
  }
  m.transcript = transcript;

  processing = true;
  processingStepIndex = 0;
  render();

  let lastErrorMessage = "";
  const apiPromise = callReportAPI(transcript).then(r => ({ ok:true, data:r })).catch((e) => { lastErrorMessage = e.message || ""; return { ok:false }; });

  await sleep(550); processingStepIndex = 1; render();
  await sleep(550); processingStepIndex = 2; render();
  await sleep(550); processingStepIndex = 3; render();
  await sleep(450); processingStepIndex = 4; render();

  const result = await apiPromise;

  processingStepIndex = 5; render();
  await sleep(450);
  processingStepIndex = 6; render();
  await sleep(900);

  processing = false;
  if(result.ok){
    m.report = result.data;
    m.report.actions = (m.report.actions || []).map(a => ({ ...a, status: "a_faire", completedDate: null }));
    m.status = "termine";
  }else{
    reportError = "La génération du rapport a échoué" + (lastErrorMessage ? " : " + lastErrorMessage : ". Réessaie dans un instant.");
  }
  render();
}

// ---------- app chrome: header clock + tab bar (static, outside #app) ----------
function updateClockDisplay(){
  const timeEl = document.getElementById("app-clock");
  const dateEl = document.getElementById("app-date");
  if(!timeEl && !dateEl) return;
  const now = new Date();
  if(timeEl) timeEl.textContent = now.toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
  if(dateEl) dateEl.textContent = now.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
}

// ---------- floating chat assistant ----------
const ASSISTANT_SUGGESTIONS = [
  "Qui devait préparer le budget ?",
  "Quand avons-nous parlé de ce projet ?",
  "Quelles décisions avons-nous prises ce mois-ci ?",
  "Quelles actions sont encore en retard ?",
  "Fais-moi le résumé de toutes les réunions concernant le projet X."
];

function buildAssistantCorpus(){
  const today = new Date(); today.setHours(0,0,0,0);
  return meetings.map(m => {
    const entry = { id: m.id, titre: m.title, date: fmtReportDate(m.date) };
    if(m.report){
      entry.resume = m.report.resume || "";
      entry.decisions = m.report.decisions || [];
      entry.points_abordes = m.report.points_abordes || [];
      entry.prochaine_reunion = m.report.prochaine_reunion || "";
      entry.actions = (m.report.actions||[]).map(a => ({
        tache: a.tache,
        responsable: a.responsable,
        echeance: a.echeance,
        statut: actionStatusLabel(a),
        en_retard: a.status !== "termine" && !!(parseFrenchDate(a.echeance) && parseFrenchDate(a.echeance) < today)
      }));
    }else{
      const t = getMeetingTranscriptText(m);
      entry.extrait_transcription = t ? t.slice(0, 600) : "";
    }
    return entry;
  });
}

async function callAssistantAPI(){
  const history = assistantMessages.filter(m => !m.loading).map(m => ({ role: m.role, content: m.text }));
  const membersContext = orgMembers.length
    ? `\nMembres connus de l'organisation (utilise ces noms et rôles pour répondre aux questions sur qui occupe quel rôle) :\n${orgMembers.map(mem => `- ${mem.name}${mem.role ? " (" + mem.role + ")" : ""}`).join("\n")}\n`
    : "";
  const systemPrompt = `Tu es l'assistant IA de l'application "Réunion IA". Tu réponds aux questions d'un membre de l'organisation sur l'historique de ses réunions, en te basant UNIQUEMENT sur les réunions listées ci-dessous (résumés, décisions, actions avec leur statut et échéance, ou extraits de transcription pour celles sans compte rendu) et sur la liste des membres. N'invente jamais une information absente de ces données ; dis-le clairement si tu ne trouves pas la réponse. Cite les dates des réunions concernées quand c'est pertinent. Réponds de façon concise et directe, en français.
${membersContext}
Réunions disponibles (JSON) :
${JSON.stringify(buildAssistantCorpus())}`;

  return await callAiService({ system: systemPrompt, messages: history, max_tokens: 800 });
}

function renderAssistantMessages(){
  const container = document.getElementById("assistant-messages");
  if(!container) return;
  if(!assistantMessages.length){
    container.innerHTML = `
      <div class="assistant-suggestions">
        <div class="notice" style="margin-bottom:4px;">Essaie par exemple :</div>
        ${ASSISTANT_SUGGESTIONS.map(q => `<button class="suggestion-chip" data-suggestion="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join("")}
      </div>
    `;
    container.querySelectorAll("[data-suggestion]").forEach(btn => {
      btn.onclick = () => sendAssistantMessage(btn.dataset.suggestion);
    });
  }else{
    container.innerHTML = assistantMessages.map(m => `
      <div class="msg ${m.role}${m.loading ? " loading" : ""}">${escapeHtml(m.text).replace(/\n/g, "<br>")}</div>
    `).join("");
  }
  container.scrollTop = container.scrollHeight;
}

async function sendAssistantMessage(text){
  const q = (text||"").trim();
  if(!q) return;

  const input = document.getElementById("assistant-input");
  if(input) input.value = "";

  assistantMessages.push({ role:"user", text:q });

  if(!meetings.length){
    assistantMessages.push({ role:"assistant", text:"Aucune réunion enregistrée pour l'instant — je n'ai encore aucune information à partager." });
    renderAssistantMessages();
    return;
  }
  if(!aiEndpoint){
    assistantMessages.push({ role:"assistant", text:"Aucun service IA n'est configuré. Va dans Réglages → 🌐 Service IA pour en configurer un — c'est nécessaire pour que je fonctionne une fois l'app déployée." });
    renderAssistantMessages();
    return;
  }

  assistantMessages.push({ role:"assistant", text:"…", loading:true });
  renderAssistantMessages();

  try{
    const reply = await callAssistantAPI();
    assistantMessages[assistantMessages.length-1] = { role:"assistant", text: reply };
  }catch(e){
    assistantMessages[assistantMessages.length-1] = { role:"assistant", text:"Désolé, la recherche a échoué" + (e.message ? " : " + e.message : ". Réessaie dans un instant.") };
  }
  renderAssistantMessages();
}

function openAssistant(){
  assistantOpen = true;
  const overlay = document.getElementById("assistant-overlay");
  if(overlay) overlay.style.display = "block";
  renderAssistantMessages();
}
function closeAssistant(){
  assistantOpen = false;
  const overlay = document.getElementById("assistant-overlay");
  if(overlay) overlay.style.display = "none";
}

function initChrome(){
  updateClockDisplay();
  setInterval(updateClockDisplay, 1000 * 30);

  const settingsBtn = document.getElementById("goto-settings-btn");
  if(settingsBtn) settingsBtn.onclick = () => {
    abortRecordingIfActive();
    settingsSaved = false;
    view = "settings";
    render();
  };

  const fabBtn = document.getElementById("assistant-fab");
  if(fabBtn) fabBtn.onclick = () => openAssistant();

  const closeBtn = document.getElementById("assistant-close-btn");
  if(closeBtn) closeBtn.onclick = () => closeAssistant();

  const sendBtn = document.getElementById("assistant-send-btn");
  const inputEl = document.getElementById("assistant-input");
  if(sendBtn && inputEl){
    sendBtn.onclick = () => sendAssistantMessage(inputEl.value);
    inputEl.onkeydown = (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendAssistantMessage(inputEl.value);
      }
    };
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
      const tab = btn.dataset.tab;
      abortRecordingIfActive();
      editingReport = false;
      exportNotice = "";
      if(tab === "settings") settingsSaved = false;
      view = tab;
      render();
    };
  });
}

});
