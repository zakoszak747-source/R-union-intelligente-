<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réunion IA</title>
<meta name="description" content="Application de réunion intelligente : enregistrement, transcription, comptes rendus IA et mémoire de l'organisation.">
<meta name="theme-color" content="#16232A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#16232A;
    --bg-elevated:#1E323B;
    --bg-card:#20343D;
    --accent:#E8A33D;
    --accent-live:#E1614F;
    --accent-2:#4FA8A0;
    --accent-3:#7C93C9;
    --text:#F2EDE4;
    --text-muted:#9CB0B6;
    --border:rgba(242,237,228,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
  }
  .app{
    padding:20px 16px 28px;
    flex:1;
    overflow-y:auto;
  }
  .app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .app-logo{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:16.5px;
    font-weight:600;
  }
  .app-header-right{display:flex;align-items:center;gap:12px;}
  .clock-block{text-align:right;line-height:1.25;}
  .clock-time{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:15px;
    font-variant-numeric:tabular-nums;
  }
  .clock-date{font-size:10.5px;color:var(--text-muted);text-transform:capitalize;}
  .settings-btn{
    background:none;border:none;
    font-size:18px;cursor:pointer;
    color:var(--text);
    padding:4px;
    line-height:1;
  }
  .tab-bar{
    display:flex;
    border-top:1px solid var(--border);
    background:var(--bg-card);
    position:sticky;
    bottom:0;
    z-index:5;
  }
  .tab-btn{
    flex:1;
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:9px 4px 11px;
    color:var(--text-muted);
    font-size:10.5px;
    font-family:inherit;
    cursor:pointer;
  }
  .tab-btn .tab-icon{font-size:17px;}
  .tab-btn.active{color:var(--accent);}
  .app-shell.fullscreen-mode .app-header,
  .app-shell.fullscreen-mode .tab-bar{display:none;}
  .app-shell.fullscreen-mode .assistant-fab{display:none;}

  .assistant-fab{
    position:fixed;
    right:16px;
    bottom:78px;
    background:var(--accent);
    color:#20140A;
    border:none;
    border-radius:22px;
    padding:11px 16px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    z-index:8;
    font-family:inherit;
  }

  .assistant-overlay{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:50;
  }
  .assistant-inner{
    max-width:480px;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  .assistant-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .assistant-title{font-family:Georgia,"Iowan Old Style",serif;font-size:16px;font-weight:600;}
  .assistant-close{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px;}
  .assistant-messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
  }
  .msg{
    max-width:85%;
    padding:10px 13px;
    border-radius:13px;
    font-size:14px;
    line-height:1.5;
    margin-bottom:10px;
  }
  .msg.user{
    background:var(--accent);
    color:#20140A;
    margin-left:auto;
    border-bottom-right-radius:4px;
  }
  .msg.assistant{
    background:var(--bg-card);
    color:var(--text);
    margin-right:auto;
    border-bottom-left-radius:4px;
  }
  .msg.assistant.loading{color:var(--text-muted);font-style:italic;}
  .assistant-suggestions{display:flex;flex-direction:column;gap:8px;}
  .suggestion-chip{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    color:var(--text);
    text-align:left;
    cursor:pointer;
    font-family:inherit;
  }
  .assistant-input-row{
    display:flex;
    gap:8px;
    padding:12px 16px;
    border-top:1px solid var(--border);
    align-items:flex-end;
  }
  .assistant-input-row textarea{
    flex:1;
    min-height:42px;
    max-height:100px;
    resize:none;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
  }
  .assistant-send{
    background:var(--accent);
    border:none;
    border-radius:10px;
    width:42px;height:42px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
    color:#20140A;
  }
  h1,h2,h3{
    font-family:Georgia,"Iowan Old Style",serif;
    font-weight:600;
    margin:0;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  header.top h1{font-size:22px;}
  header.top span{
    color:var(--text-muted);
    font-size:13px;
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-accent{background:var(--accent);color:#20140A;}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:var(--accent-live);color:#2A0E0A;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .fab-new{
    display:block;
    width:100%;
    margin-bottom:18px;
  }

  .card{
    background:var(--bg-card);
    border-left:3px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .card.status-enregistrement{border-left-color:var(--accent-live);}
  .card.status-termine{border-left-color:var(--accent);}
  .card-date{
    flex-shrink:0;
    width:40px;
    text-align:center;
    font-size:11.5px;
    line-height:1.5;
    color:var(--text-muted);
    text-transform:uppercase;
    padding-top:1px;
  }
  .card h3{font-size:16px;margin-bottom:4px;}
  .card .meta{font-size:12.5px;color:var(--text-muted);}
  .card-body{flex:1;min-width:0;}

  .month-label{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:13px;
    color:var(--text-muted);
    text-transform:capitalize;
    margin:18px 0 8px;
  }
  .month-group:first-child .month-label{margin-top:4px;}
  .filters-block{background:var(--bg-card);border-radius:10px;padding:12px;margin-bottom:6px;}
  .filters-row{display:flex;gap:8px;margin-bottom:8px;}
  .filters-row:last-child{margin-bottom:0;}
  .filters-row select, .filters-row input{
    flex:1;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    color:var(--text);
    font-size:12.5px;
    font-family:inherit;
  }
  .filters-block [data-clear-filters]{margin-top:8px;}
  .empty{
    text-align:center;
    color:var(--text-muted);
    padding:60px 20px;
    font-size:14.5px;
    line-height:1.6;
  }

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:11px 12px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
  }
  .field textarea{min-height:120px;resize:vertical;line-height:1.5;}

  .back{
    color:var(--text-muted);
    font-size:14px;
    background:none;
    border:none;
    cursor:pointer;
    padding:0 0 16px;
    font-family:inherit;
  }

  .detail-header{margin-bottom:18px;}
  .detail-header .meta{color:var(--text-muted);font-size:13px;margin-top:4px;}

  .record-zone{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 0 10px;
    margin-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .record-btn{
    width:86px;height:86px;
    border-radius:50%;
    border:none;
    background:var(--accent-live);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    position:relative;
  }
  .record-btn .dot{width:26px;height:26px;border-radius:6px;background:#2A0E0A;}
  .record-btn.idle{background:var(--accent);}
  .record-btn.idle .dot{border-radius:50%;background:#20140A;}
  .record-btn.pulse::after{
    content:"";
    position:absolute;inset:-8px;
    border-radius:50%;
    border:2px solid var(--accent-live);
    animation:pulse 1.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(1);opacity:0.7;}
    100%{transform:scale(1.35);opacity:0;}
  }
  .record-label{margin-top:12px;font-size:13.5px;color:var(--text-muted);}
  .timer{font-variant-numeric:tabular-nums;font-size:14px;margin-top:4px;color:var(--text);}

  section.block{margin:20px 0;}
  section.block h2{font-size:15px;margin-bottom:8px;}
  .transcript-box{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    font-size:14px;
    line-height:1.6;
    min-height:80px;
    white-space:pre-wrap;
  }
  .transcript-box.interim{color:var(--text-muted);}

  audio{width:100%;margin-top:8px;}

  .report{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:8px;
    padding:16px;
  }
  .report-head{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .report-title{font-family:Georgia,"Iowan Old Style",serif;font-size:16px;margin-bottom:8px;line-height:1.4;}
  .report-meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--text-muted);font-size:12.5px;}
  .report h4{font-size:14px;margin:16px 0 6px;color:var(--accent);font-family:Georgia,"Iowan Old Style",serif;font-weight:600;}
  .report h4:first-of-type{margin-top:0;}
  .report p{font-size:14px;line-height:1.55;margin:0 0 8px;}
  .report ul{margin:0 0 8px;padding-left:18px;font-size:14px;line-height:1.6;}
  .report-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:6px;}
  .table-scroll{overflow-x:auto;margin-bottom:6px;}
  .table-scroll .report-table{margin-bottom:0;min-width:420px;}
  .report-table th{text-align:left;color:var(--text-muted);font-weight:600;font-size:12px;padding:6px 8px 6px 0;border-bottom:1px solid var(--border);}
  .report-table td{padding:9px 8px 9px 0;border-bottom:1px solid var(--border);}
  .report-table tr:last-child td{border-bottom:none;}
  .stack-gap > *{margin-bottom:8px;}
  .stack-gap > *:last-child{margin-bottom:0;}
  .edit-action-row{margin-bottom:10px;}
  .edit-action-row .edit-action-tache{margin-bottom:6px;}
  .edit-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .edit-row input{flex:1;margin-bottom:0;}
  .row-remove{
    background:none;border:none;color:var(--text-muted);
    font-size:16px;cursor:pointer;padding:4px 8px;flex-shrink:0;
    font-family:inherit;
  }
  .row-remove:hover{color:var(--accent-live);}
  .edit-action-row .row-remove{margin-top:0;}
  .add-btn{margin-top:2px;padding:8px 14px;font-size:13px;width:auto;}

  .org-logo-placeholder{
    width:64px;height:64px;
    border-radius:14px;
    background:var(--bg-card);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:26px;
    color:var(--accent);
    flex-shrink:0;
  }
  .org-logo-img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;}

  .activity-list{background:var(--bg-card);border-radius:10px;padding:2px 16px;}
  .activity-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 0;
    border-bottom:1px solid var(--border);
    font-size:14.5px;
  }
  .activity-row:last-child{border-bottom:none;}
  .activity-value{font-family:Georgia,"Iowan Old Style",serif;font-size:19px;color:var(--accent);}
  .activity-row.warn .activity-value{color:var(--accent-live);}

  #print-area{display:none;}
  @media print{
    body > *:not(#print-area){display:none !important;}
    #print-area{
      display:block !important;
      color:#111;
      background:#fff;
      padding:0;
      font-family:Georgia,serif;
    }
    #print-area h1{font-size:20px;margin-bottom:4px;}
    #print-area h2{font-size:15px;margin:16px 0 6px;color:#111;}
    #print-area p, #print-area li{font-size:13px;line-height:1.5;color:#111;}
    #print-area table{border-collapse:collapse;width:100%;font-size:12.5px;}
    #print-area th, #print-area td{border:1px solid #333;padding:6px 8px;text-align:left;}
  }

  .notice{
    font-size:12.5px;
    color:var(--text-muted);
    line-height:1.5;
    padding:10px 12px;
    background:var(--bg-elevated);
    border-radius:8px;
    margin-top:10px;
  }
  .status-msg{font-size:13px;color:var(--accent);margin-top:8px;}
  .status-msg.error{color:var(--accent-live);}

  .install-banner{
    background:var(--bg-card);
    border:1px solid var(--accent);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:14px;
  }
  .install-text{font-size:13px;line-height:1.5;margin-bottom:8px;}
  .install-row{display:flex;align-items:center;gap:10px;}
  .install-dismiss{background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;font-family:inherit;padding:8px 4px;}

  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .greeting{margin-bottom:2px;font-size:21px;}
  .subgreeting{color:var(--text-muted);font-size:13.5px;margin-bottom:20px;}

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .stat{
    background:var(--bg-card);
    border-radius:8px;
    padding:14px 14px 12px;
    border-left:3px solid var(--border);
  }
  .stat .icon{font-size:17px;}
  .stat .value{font-family:Georgia,"Iowan Old Style",serif;font-size:26px;line-height:1.2;margin-top:6px;}
  .stat .label{color:var(--text-muted);font-size:12px;margin-top:2px;}
  .stat.c-meetings{border-left-color:var(--accent-2);}
  .stat.c-decisions{border-left-color:var(--accent);}
  .stat.c-actions{border-left-color:var(--accent-3);}
  .stat.late{border-left-color:var(--accent-live);}
  .stat.late .value{color:var(--accent-live);}

  .org-banner{
    position:relative;
    height:118px;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:14px;
    background:linear-gradient(135deg, var(--bg-card), var(--bg-elevated));
  }
  .org-banner .banner-img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .org-banner .banner-overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(22,35,42,0) 25%, rgba(22,35,42,0.88) 100%);
    display:flex; align-items:flex-end;
    gap:10px;
    padding:12px 14px;
  }
  .banner-logo{
    width:38px;height:38px;border-radius:10px;
    object-fit:cover;
    border:2px solid var(--bg);
    flex-shrink:0;
  }
  .banner-logo-placeholder{
    width:38px;height:38px;border-radius:10px;
    background:var(--accent);
    color:#20140A;
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Iowan Old Style",serif;font-weight:600;font-size:17px;
    flex-shrink:0;
    border:2px solid var(--bg);
  }
  .banner-org-name{
    color:#fff;
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:15.5px;
    font-weight:600;
    text-shadow:0 1px 4px rgba(0,0,0,0.5);
  }

  .ticker{
    overflow:hidden;
    white-space:nowrap;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 0;
    margin-bottom:16px;
  }
  .ticker-track{
    display:inline-block;
    padding-left:100%;
    animation:ticker-scroll 24s linear infinite;
    font-size:12.5px;
    color:var(--text-muted);
  }
  .ticker-track span{margin-right:36px;}
  .ticker-track .hot{color:var(--accent-live);}
  @keyframes ticker-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .section-head h2{font-size:15px;}
  .section-head .see-all{
    font-size:12.5px;
    color:var(--text-muted);
    background:none;border:none;cursor:pointer;font-family:inherit;
  }

  .action-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .action-row:last-child{border-bottom:none;}
  .action-row .tache{flex:1;padding-right:10px;}
  .action-row .who-when{color:var(--text-muted);font-size:12.5px;white-space:nowrap;}

  .mini-card{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:11px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
    cursor:pointer;
  }
  .mini-card:last-child{border-bottom:none;}
  .mini-card .date{color:var(--text-muted);font-size:12.5px;white-space:nowrap;}

  .mode-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:16px 10px;
    font-size:14.5px;
    text-align:center;
  }
  .file-label{
    display:block;
    text-align:center;
    cursor:pointer;
  }

  .rec-screen{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
  }
  .rec-eyebrow{
    color:var(--text-muted);
    font-size:13px;
    letter-spacing:0.02em;
  }
  .rec-timer{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:52px;
    margin:10px 0 4px;
    font-variant-numeric:tabular-nums;
  }
  .rec-status{
    font-size:14px;
    color:var(--accent-live);
    margin-bottom:34px;
  }
  .rec-status.paused{color:var(--text-muted);}
  .rec-actions{
    display:flex;
    gap:12px;
    width:100%;
    margin-bottom:22px;
  }
  .rec-actions .btn{flex:1;padding:15px 10px;}
  .rec-lock{
    color:var(--text-muted);
    font-size:12.5px;
    max-width:280px;
    line-height:1.5;
  }
  .rec-confirm{width:100%;}
  .rec-confirm p{font-size:15px;margin:0 0 18px;}

  .proc-screen{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .proc-title{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:19px;
    text-align:center;
    margin-bottom:26px;
  }
  .proc-list{display:flex;flex-direction:column;gap:15px;}
  .proc-row{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text-muted);}
  .proc-row.done{color:var(--text);}
  .proc-row.current{color:var(--accent);}
  .proc-icon{width:18px;text-align:center;font-size:15px;flex-shrink:0;}
  .proc-row.done .proc-icon{color:var(--accent);}
  .proc-row.current .proc-icon{animation:proc-pulse 1s ease-in-out infinite;}
  @keyframes proc-pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .proc-ready{
    font-family:Georgia,"Iowan Old Style",serif;
    font-size:21px;
    text-align:center;
  }
  .proc-ready .proc-check{color:var(--accent);margin-left:4px;}

  .seg{
    background:var(--bg-card);
    border-radius:8px;
    padding:12px 12px 10px;
    margin-bottom:10px;
    border-left:3px solid var(--border);
  }
  .seg.seg-match{border-left-color:var(--accent);}
  .seg-meta{display:flex;gap:8px;margin-bottom:6px;}
  .seg-time{
    width:58px;flex-shrink:0;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:6px;
    padding:5px 6px;
    color:var(--text-muted);
    font-size:12px;
    font-variant-numeric:tabular-nums;
    font-family:inherit;
  }
  .seg-speaker{
    flex:1;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:6px;
    padding:5px 8px;
    color:var(--accent);
    font-size:12.5px;
    font-weight:600;
    font-family:inherit;
  }
  .seg-text{
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:14.5px;
    line-height:1.55;
    resize:vertical;
    min-height:44px;
    font-family:inherit;
    padding:0;
  }
  .seg-text:focus{outline:none;}
  .search-count{font-size:12px;color:var(--text-muted);margin-top:4px;}

  .participant-row .seg-meta{margin-bottom:0;}
  .p-name, .m-name{
    flex:1;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px 10px;
    color:var(--text);
    font-size:14px;
    font-family:inherit;
  }
  .p-email, .m-role{
    width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px 10px;
    color:var(--text-muted);
    font-size:13px;
    font-family:inherit;
    margin-top:8px;
  }

  .action-track-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
  .action-track-row:last-child{border-bottom:none;}
  .action-check{
    background:none;
    border:1px solid var(--border);
    border-radius:6px;
    width:26px;height:26px;
    flex-shrink:0;
    font-size:13px;
    color:var(--text-muted);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;
    margin-top:1px;
  }
  .action-check.progress{color:var(--accent);border-color:var(--accent);}
  .action-check.done{color:var(--accent);border-color:var(--accent);background:rgba(232,163,61,0.15);}
  .action-track-title{font-size:14.5px;margin-bottom:2px;}
  .action-track-title.done{color:var(--text-muted);text-decoration:line-through;}
  .action-track-meta{font-size:12.5px;color:var(--text-muted);}

  .status-pill{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:20px;
    padding:5px 10px;
    font-size:11.5px;
    color:var(--text-muted);
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .status-pill .status-icon{font-size:11px;}
  .status-pill.progress{color:var(--accent);border-color:var(--accent);}
  .status-pill.done{color:var(--accent);border-color:var(--accent);background:rgba(232,163,61,0.12);}
</style>
</head>
<body>
<div class="app-shell" id="app-shell">
  <header class="app-header">
    <div class="app-logo">🎙️ Réunion IA</div>
    <div class="app-header-right">
      <div class="clock-block">
        <div class="clock-time" id="app-clock">--:--</div>
        <div class="clock-date" id="app-date">--</div>
      </div>
      <button class="settings-btn" id="goto-settings-btn" aria-label="Réglages">⚙️</button>
    </div>
  </header>

  <div class="app" id="app"></div>

  <button class="assistant-fab" id="assistant-fab">💬 Ask Réunion IA</button>

  <nav class="tab-bar">
    <button class="tab-btn" data-tab="dashboard"><span class="tab-icon">🏠</span><span>Accueil</span></button>
    <button class="tab-btn" data-tab="list"><span class="tab-icon">📅</span><span>Réunions</span></button>
    <button class="tab-btn" data-tab="actions"><span class="tab-icon">🎯</span><span>Actions</span></button>
    <button class="tab-btn" data-tab="memory"><span class="tab-icon">🔎</span><span>Mémoire</span></button>
    <button class="tab-btn" data-tab="settings"><span class="tab-icon">⚙️</span><span>Réglages</span></button>
  </nav>
</div>
<div id="print-area"></div>

<div class="assistant-overlay" id="assistant-overlay" style="display:none;">
  <div class="assistant-inner">
    <div class="assistant-header">
      <div class="assistant-title">💬 Ask Réunion IA</div>
      <button class="assistant-close" id="assistant-close-btn" aria-label="Fermer">✕</button>
    </div>
    <div class="assistant-messages" id="assistant-messages"></div>
    <div class="assistant-input-row">
      <textarea id="assistant-input" placeholder="Pose une question sur tes réunions…"></textarea>
      <button class="assistant-send" id="assistant-send-btn" aria-label="Envoyer">➤</button>
    </div>
  </div>
</div>

<script>
// ---------- state ----------
let meetings = [];
let view = "dashboard"; // dashboard | list | new | detail
let currentId = null;
let idCounter = 1;
let userName = "Jean"; // temporaire, tant que l'authentification n'est pas branchée

let mediaRecorder = null;
let audioChunks = [];
let recognition = null;
let recordingSessionActive = false;
let paused = false;
let confirmingEnd = false;
let timerInterval = null;
let secondsElapsed = 0;
let processing = false;
let processingStepIndex = 0;
let reportError = "";
let editingReport = false;
let exportNotice = "";
let segIdCounter = 1;
let transcriptSaved = false;
let partIdCounter = 1;
let participantsSaved = false;
let settingsSaved = false;
let orgMembers = [];
let memberIdCounter = 1;
let membersSaved = false;
let organization = { name:"", logo:null, banner:null, type:"", address:"", phone:"" };
let organizationSaved = false;
let orgRoles = [];
let roleIdCounter = 1;
let rolesSaved = false;
let orgProjects = [];
let projectIdCounter = 1;
let projectsSaved = false;
let filterProject = "all";
let deferredInstallPrompt = null;
let installBannerDismissed = false;
const isStandaloneApp = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const isIOSDevice = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  render();
});

async function triggerInstall(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  render();
}
let memoryQuery = "";
let memoryAnswer = null;
let memoryLoading = false;
let memoryError = "";
let showMemorySources = false;
let assistantOpen = false;
let assistantMessages = [];

const PROCESSING_STEPS = ["Audio reçu","Transcription terminée","Décisions analysées","Actions identifiées","Construction du compte rendu","Mise à jour de la mémoire"];

const speechSupported = ("webkitSpeechRecognition" in window) || ("SpeechRecognition" in window);
const TYPE_OPTIONS = ["Association","Entreprise","École","ONG","Coopérative","Église","Administration","Projet","Autre"];

function fmtDate(d){
  return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
function fmtReportDate(d){
  return d.toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
}
function fmtDuration(seconds){
  if(seconds === null || seconds === undefined || isNaN(seconds)) return null;
  const h = Math.floor(seconds/3600);
  const m = Math.round((seconds%3600)/60);
  if(h > 0) return `${h} h ${m.toString().padStart(2,"0")}`;
  if(m > 0) return `${m} min`;
  return "moins d'1 min";
}
function fmtTimer(s){
  const m = Math.floor(s/60).toString().padStart(2,"0");
  const sec = (s%60).toString().padStart(2,"0");
  return m+":"+sec;
}

function segmentsToText(segments){
  return (segments||[]).map(s => (s.speaker ? s.speaker+" : " : "") + s.text).filter(t => t.trim()).join("\n");
}
function getMeetingTranscriptText(m){
  return segmentsToText(m.segments) || (m.transcript || "");
}
function syncSegmentsFromDOM(m){
  const wrappers = document.querySelectorAll(".seg");
  if(!wrappers.length) return;
  const updated = [];
  wrappers.forEach(w => {
    updated.push({
      id: Number(w.dataset.segId),
      time: w.querySelector(".seg-time")?.value ?? "",
      speaker: w.querySelector(".seg-speaker")?.value ?? "",
      text: w.querySelector(".seg-text")?.value ?? ""
    });
  });
  m.segments = updated;
}

function getParticipantCount(m){
  if(m.participants && m.participants.length) return m.participants.length;
  return m.participantCount || null;
}
function syncParticipantsFromDOM(m){
  const wrappers = document.querySelectorAll(".participant-row");
  if(!wrappers.length) return;
  const updated = [];
  wrappers.forEach(w => {
    updated.push({
      id: Number(w.dataset.pId),
      name: w.querySelector(".p-name")?.value ?? "",
      email: w.querySelector(".p-email")?.value ?? ""
    });
  });
  m.participants = updated;
}

const FR_MONTHS = {"janv":0,"févr":1,"fevr":1,"mars":2,"avr":3,"mai":4,"juin":5,"juil":6,"août":7,"aout":7,"sept":8,"oct":9,"nov":10,"déc":11,"dec":11};
function parseFrenchDate(str){
  if(!str) return null;
  const m = String(str).toLowerCase().match(/(\d{1,2})\s*([a-zéû]+)/i);
  if(!m) return null;
  const day = parseInt(m[1], 10);
  const monthKey = Object.keys(FR_MONTHS).find(k => m[2].startsWith(k));
  if(monthKey === undefined) return null;
  const now = new Date();
  const d = new Date(now.getFullYear(), FR_MONTHS[monthKey], day);
  return isNaN(d.getTime()) ? null : d;
}

function collectAllActions(){
  const list = [];
  meetings.forEach(m => {
    if(m.report && m.report.actions){
      m.report.actions.forEach((a,i) => list.push({ ...a, status: a.status || "a_faire", meetingId: m.id, meetingTitle: m.title, actionIndex: i }));
    }
  });
  return list;
}

function computeStats(){
  const actions = collectAllActions();
  const decisions = meetings.reduce((n, m) => n + (m.report && m.report.decisions ? m.report.decisions.length : 0), 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const late = actions.filter(a => {
    if(a.status === "termine") return false;
    const d = parseFrenchDate(a.echeance);
    return d && d < today;
  }).length;
  return { reunions: meetings.length, decisions, actions: actions.length, late };
}

// ---------- rendering ----------
function render(){
  const app = document.getElementById("app");
  if(processing) app.innerHTML = renderProcessingScreen();
  else if(view === "dashboard") app.innerHTML = renderDashboard();
  else if(view === "list") app.innerHTML = renderList();
  else if(view === "new") app.innerHTML = renderNew();
  else if(view === "detail") app.innerHTML = renderDetail();
  else if(view === "transcription") app.innerHTML = renderTranscriptionScreen();
  else if(view === "participants") app.innerHTML = renderParticipantsScreen();
  else if(view === "actions") app.innerHTML = renderActionsScreen();
  else if(view === "memory") app.innerHTML = renderMemoryScreen();
  else if(view === "settings") app.innerHTML = renderSettings();
  else if(view === "members") app.innerHTML = renderMembersScreen();
  else if(view === "organization") app.innerHTML = renderOrganizationScreen();
  else if(view === "roles") app.innerHTML = renderRolesScreen();
  else if(view === "projects") app.innerHTML = renderProjectsScreen();
  else if(view === "org-activity") app.innerHTML = renderOrgActivityScreen();
  bindEvents();
  updateChromeState();
}

function activeTabFor(v){
  if(v === "dashboard") return "dashboard";
  if(v === "settings" || v === "members" || v === "organization" || v === "roles" || v === "projects" || v === "org-activity") return "settings";
  if(v === "actions") return "actions";
  if(v === "memory") return "memory";
  return "list";
}

function updateChromeState(){
  const shell = document.getElementById("app-shell");
  if(shell) shell.classList.toggle("fullscreen-mode", processing || recordingSessionActive);
  const activeTab = activeTabFor(view);
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === activeTab);
  });
}

function renderProcessingScreen(){
  if(processingStepIndex >= PROCESSING_STEPS.length){
    return `<div class="proc-screen"><div class="proc-ready">Compte rendu prêt <span class="proc-check">✓</span></div></div>`;
  }
  const rows = PROCESSING_STEPS.map((label, i) => {
    const icon = i < processingStepIndex ? "✓" : (i === processingStepIndex ? "●" : "○");
    const cls = i < processingStepIndex ? "done" : (i === processingStepIndex ? "current" : "");
    return `<div class="proc-row ${cls}"><span class="proc-icon">${icon}</span>${escapeHtml(label)}</div>`;
  }).join("");
  return `
    <div class="proc-screen">
      <div class="proc-title">Traitement de votre réunion</div>
      <div class="proc-list">${rows}</div>
    </div>
  `;
}

function cycleActionStatus(meetingId, actionIndex){
  const m = meetings.find(x => x.id === meetingId);
  if(!m || !m.report || !m.report.actions || !m.report.actions[actionIndex]) return;
  const a = m.report.actions[actionIndex];
  if(!a.status || a.status === "a_faire"){
    a.status = "en_cours";
    a.completedDate = null;
  }else if(a.status === "en_cours"){
    a.status = "termine";
    a.completedDate = new Date();
  }else{
    a.status = "a_faire";
    a.completedDate = null;
  }
  render();
}

function renderActionsScreen(){
  const all = collectAllActions();
  const todo = all.filter(a => a.status === "a_faire");
  const inProgress = all.filter(a => a.status === "en_cours");
  const done = all.filter(a => a.status === "termine");

  const rowHTML = (a, icon, cls) => {
    const metaBits = [];
    if(a.responsable) metaBits.push(escapeHtml(a.responsable));
    if(a.status === "termine"){
      metaBits.push(a.completedDate ? "Terminé le " + escapeHtml(fmtReportDate(new Date(a.completedDate))) : "Terminé");
    }else if(a.echeance){
      metaBits.push(escapeHtml(a.echeance));
    }
    metaBits.push(escapeHtml(a.meetingTitle));
    return `
      <div class="action-track-row">
        <button class="action-check ${cls}" data-toggle-action data-meeting-id="${a.meetingId}" data-action-index="${a.actionIndex}">${icon}</button>
        <div>
          <div class="action-track-title ${cls==='done' ? 'done' : ''}">${escapeHtml(a.tache)}</div>
          <div class="action-track-meta">${metaBits.join(" · ")}</div>
        </div>
      </div>
    `;
  };

  const section = (title, items, icon, cls) => items.length ? `
    <section class="block">
      <h2>${title}</h2>
      ${items.map(a => rowHTML(a, icon, cls)).join("")}
    </section>
  ` : "";

  if(!all.length){
    return `
      <h2 style="font-size:19px;margin-bottom:14px;">Toutes les actions</h2>
      <div class="empty">Aucune action pour l'instant. Elles apparaîtront ici après la génération d'un compte rendu.</div>
    `;
  }

  return `
    <h2 style="font-size:19px;margin-bottom:14px;">Toutes les actions</h2>
    ${section("À FAIRE", todo, "☐", "")}
    ${section("En cours", inProgress, "◉", "progress")}
    ${section("Terminées", done, "✓", "done")}
  `;
}

function renderMemoryScreen(){
  const suggestion = "Qu'avons-nous décidé concernant le projet de formation ?";
  return `
    <h2 style="font-size:19px;margin-bottom:6px;">🔎 Mémoire de l'organisation</h2>
    <div class="notice" style="margin-bottom:14px;">Pose une question sur l'historique de vos réunions — l'IA cherche dans les comptes rendus et transcriptions déjà enregistrés.</div>
    <div class="field">
      <textarea id="memory-question" placeholder="Ex. ${escapeHtml(suggestion)}">${escapeHtml(memoryQuery)}</textarea>
    </div>
    <button class="btn btn-accent btn-block" data-ask-memory ${memoryLoading ? "disabled" : ""}>${memoryLoading ? "Recherche en cours…" : "🔎 Demander à la mémoire"}</button>
    ${memoryError ? `<div class="status-msg error">${escapeHtml(memoryError)}</div>` : ""}
    ${memoryAnswer ? renderMemoryAnswer() : (meetings.length === 0 ? `<div class="notice" style="margin-top:14px;">Aucune réunion enregistrée pour l'instant — la mémoire se remplira au fur et à mesure de tes réunions.</div>` : "")}
  `;
}

function renderMemoryAnswer(){
  const lines = memoryAnswer.reponse.split("\n").map(l => l.trim()).filter(Boolean);
  const sourceMeetings = (memoryAnswer.reunions_utilisees||[]).map(id => meetings.find(m => m.id === id)).filter(Boolean);

  return `
    <section class="block" style="margin-top:18px;">
      <div class="report">
        ${lines.map(l => `<p>${escapeHtml(l)}</p>`).join("")}
      </div>
      ${sourceMeetings.length ? `
        <button class="btn btn-ghost btn-block" data-toggle-memory-sources style="margin-top:10px;">${showMemorySources ? "Masquer" : "👁️ Voir"} les réunions concernées</button>
        ${showMemorySources ? `
          <div style="margin-top:10px;">
            ${sourceMeetings.map(m => `
              <div class="mini-card" data-open="${m.id}">
                <span>${escapeHtml(m.title)}</span>
                <span class="date">${m.date.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})}</span>
              </div>
            `).join("")}
          </div>
        ` : ""}
      ` : ""}
    </section>
  `;
}

function renderSettings(){
  return `
    <h2 style="font-size:19px;margin-bottom:18px;">Réglages</h2>
    <div class="field">
      <label>Votre nom</label>
      <input type="text" id="settings-username" value="${escapeHtml(userName)}">
    </div>
    <button class="btn btn-accent btn-block" data-save-settings>Enregistrer</button>
    ${settingsSaved ? `<div class="status-msg">Réglages enregistrés ✓</div>` : ""}

    <section class="block" style="margin-top:30px;">
      <div class="section-head">
        <h2 style="font-size:15px;">🏢 Mon organisation</h2>
        <button class="see-all" data-open-organization>Gérer</button>
      </div>
      <div class="notice">${escapeHtml(organization.name || "Aucune organisation configurée.")}</div>
    </section>

    <section class="block" style="margin-top:20px;">
      <h2 style="font-size:15px;margin-bottom:8px;">📲 Application</h2>
      ${isStandaloneApp ? `
        <div class="notice">L'application est déjà installée sur cet appareil ✓</div>
      ` : deferredInstallPrompt ? `
        <div class="notice" style="margin-bottom:10px;">Installe Réunion IA comme une vraie application, avec son icône sur ton écran d'accueil.</div>
        <button class="btn btn-accent btn-block" data-install-app>📲 Installer l'application</button>
      ` : isIOSDevice ? `
        <div class="notice">Sur iPhone/iPad : touche 📤 Partager dans Safari, puis "Sur l'écran d'accueil".</div>
      ` : `
        <div class="notice">L'option d'installation apparaîtra ici dès que ton navigateur la propose (selon l'appareil et le navigateur utilisés).</div>
      `}
    </section>

    <section class="block" style="margin-top:20px;">
      <h2 style="font-size:15px;margin-bottom:8px;">Données</h2>
      <div class="notice">Ce prototype ne conserve pas encore les données entre les sessions : tout est perdu si tu recharges la page ou fermes l'application.</div>
      <button class="btn btn-ghost btn-block" data-reset-data style="margin-top:10px;">🗑️ Effacer toutes les réunions</button>
    </section>
  `;
}

function renderOrganizationScreen(){
  const logoBlock = organization.logo
    ? `<img class="org-logo-img" src="${organization.logo}" alt="Logo">`
    : `<div class="org-logo-placeholder">${escapeHtml((organization.name||"?").charAt(0).toUpperCase())}</div>`;

  return `
    <button class="back" data-back-settings>‹ Réglages</button>
    <h2 style="font-size:19px;margin-bottom:16px;">🏢 Mon organisation</h2>

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
      ${logoBlock}
      <label class="btn btn-ghost add-btn" style="cursor:pointer;">
        Changer le logo
        <input type="file" id="org-logo-input" accept="image/*" style="display:none;">
      </label>
    </div>

    <div style="margin-bottom:18px;">
      <label class="btn btn-ghost add-btn" style="cursor:pointer;">
        ${organization.banner ? "Changer la bannière" : "Ajouter une bannière"}
        <input type="file" id="org-banner-input" accept="image/*" style="display:none;">
      </label>
      ${organization.banner ? `<img src="${organization.banner}" style="width:100%;height:80px;object-fit:cover;border-radius:10px;margin-top:8px;" alt="Bannière">` : ""}
    </div>

    <div class="field">
      <label>Nom de l'organisation</label>
      <input type="text" id="org-name" value="${escapeHtml(organization.name)}">
    </div>
    <div class="field">
      <label>Type</label>
      <select id="org-type">
        <option value="">—</option>
        ${TYPE_OPTIONS.map(t => `<option value="${t}" ${organization.type===t?"selected":""}>${t}</option>`).join("")}
      </select>
    </div>
    <div class="field">
      <label>Adresse</label>
      <input type="text" id="org-address" value="${escapeHtml(organization.address)}">
    </div>
    <div class="field">
      <label>Téléphone</label>
      <input type="tel" id="org-phone" value="${escapeHtml(organization.phone)}">
    </div>
    <button class="btn btn-accent btn-block" data-save-organization>Enregistrer</button>
    ${organizationSaved ? `<div class="status-msg">Organisation enregistrée ✓</div>` : ""}

function computeOrgActivity(){
  const currentMonthKey = monthKeyOf(new Date());
  const reunionsCeMois = meetings.filter(m => monthKeyOf(m.date) === currentMonthKey).length;
  const actions = collectAllActions();
  const decisions = meetings.reduce((n, m) => n + (m.report && m.report.decisions ? m.report.decisions.length : 0), 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const done = actions.filter(a => a.status === "termine").length;
  const late = actions.filter(a => {
    if(a.status === "termine") return false;
    const d = parseFrenchDate(a.echeance);
    return d && d < today;
  }).length;
  return { reunionsCeMois, decisions, actions: actions.length, done, late };
}

let filterMonth = "all";
let filterType = "all";
let filterPerson = "";
let filterSearch = "";

function capitalizeFirst(s){
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function monthKeyOf(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

function getAvailableMonths(){
  const map = new Map();
  meetings.forEach(m => {
    const key = monthKeyOf(m.date);
    if(!map.has(key)) map.set(key, m.date.toLocaleDateString("fr-FR", { month:"long", year:"numeric" }));
  });
  return Array.from(map.entries()).sort((a,b) => b[0].localeCompare(a[0]));
}

function meetingMatchesFilters(m){
  if(filterMonth !== "all" && monthKeyOf(m.date) !== filterMonth) return false;
  if(filterType !== "all" && m.type !== filterType) return false;
  if(filterProject !== "all" && String(m.projectId||"") !== filterProject) return false;
  if(filterPerson.trim()){
    const q = filterPerson.trim().toLowerCase();
    const inParticipants = (m.participants||[]).some(p => (p.name||"").toLowerCase().includes(q));
    const inResponsables = (m.report && m.report.actions ? m.report.actions : []).some(a => (a.responsable||"").toLowerCase().includes(q));
    if(!inParticipants && !inResponsables) return false;
  }
  if(filterSearch.trim()){
    const q = filterSearch.trim().toLowerCase();
    const hay = [
      m.title,
      m.report ? m.report.resume : "",
      ...(m.report ? (m.report.decisions||[]) : []),
      ...(m.report ? (m.report.points_abordes||[]) : [])
    ].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function groupMeetingsByMonth(list){
  const map = new Map();
  list.forEach(m => {
    const key = monthKeyOf(m.date);
    if(!map.has(key)) map.set(key, { label: m.date.toLocaleDateString("fr-FR", { month:"long", year:"numeric" }), items: [] });
    map.get(key).items.push(m);
  });
  return Array.from(map.entries()).sort((a,b) => b[0].localeCompare(a[0])).map(([,v]) => v);
}

function statusIconLabel(m){
  if(m.status === "termine") return "✓ Compte rendu";
  return statusLabel(m.status);
}

function buildMeetingGroupsHTML(){
  const filtered = meetings.filter(meetingMatchesFilters);
  const grouped = groupMeetingsByMonth(filtered.slice().reverse());
  return grouped.length ? grouped.map(g => `
    <div class="month-group">
      <div class="month-label">${escapeHtml(capitalizeFirst(g.label))}</div>
      ${g.items.map(m => `
        <div class="card status-${m.status}" data-open="${m.id}">
          <div class="card-date">${m.date.toLocaleDateString("fr-FR", { day:"2-digit" })}<br>${m.date.toLocaleDateString("fr-FR", { month:"short" })}</div>
          <div class="card-body">
            <h3>${escapeHtml(m.title)}</h3>
            <div class="meta">${m.type ? escapeHtml(m.type)+" · " : ""}${statusIconLabel(m)}</div>
          </div>
        </div>
      `).join("")}
    </div>
  `).join("") : `<div class="empty">Aucune réunion ne correspond à ces filtres.</div>`;
}

    return renderRecordingScreen(m);

  const transcriptText = getMeetingTranscriptText(m);
  const preview = transcriptText ? (transcriptText.length > 160 ? transcriptText.slice(0,160)+"…" : transcriptText) : "Aucune transcription pour l'instant.";
  const participantsPreview = (m.participants && m.participants.length)
    ? m.participants.map(p => p.name || p.email).filter(Boolean).join(", ")
    : "Aucun participant enregistré.";

  const recordSection = (m.entryMode === "record" && !m.audioURL) ? `

function safeFileName(title){
  const base = (title||"reunion").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  return (base || "reunion").slice(0,60);
}

function actionStatusLabel(a){
  const status = a.status || "a_faire";
  if(status === "termine") return a.completedDate ? "Terminé le " + fmtReportDate(new Date(a.completedDate)) : "Terminé";
  if(status === "en_cours") return "En cours";
  return "À faire";
}

function buildReportPlainText(m){
  const r = m.report;
  const lines = [];
  lines.push(`Compte rendu — ${m.title}`);
  const metaParts = [fmtReportDate(m.date)];
  const dur = fmtDuration(m.durationSeconds);
  if(dur) metaParts.push(dur);
  const pc1 = getParticipantCount(m); if(pc1) metaParts.push(pc1 + " participant" + (pc1>1?"s":""));
  lines.push(metaParts.join(" · "));
  lines.push("");
  lines.push("Résumé");
  lines.push(r.resume || "");
  if((r.points_abordes||[]).length){
    lines.push(""); lines.push("Points abordés");
    r.points_abordes.forEach(p => lines.push("- " + p));
  }
  if((r.decisions||[]).length){
    lines.push(""); lines.push("Décisions prises");
    r.decisions.forEach(d => lines.push("- " + d));
  }
  if((r.actions||[]).length){
    lines.push(""); lines.push("Actions");
    r.actions.forEach(a => lines.push(`- ${a.tache} — Responsable : ${a.responsable||"—"} — Échéance : ${a.echeance||"—"} — Statut : ${actionStatusLabel(a)}`));
  }
  if((r.questions||[]).length){
    lines.push(""); lines.push("Questions non résolues");
    r.questions.forEach(q => lines.push("- " + q));
  }
  if(r.prochaine_reunion){
    lines.push(""); lines.push("Prochaine réunion");
    lines.push(r.prochaine_reunion);
  }
  return lines.join("\n");
}

function buildReportHTMLBody(m){
  const r = m.report;
  const dur = fmtDuration(m.durationSeconds);
  const metaParts = [fmtReportDate(m.date)];
  if(dur) metaParts.push(dur);
  const pc1 = getParticipantCount(m); if(pc1) metaParts.push(pc1 + " participant" + (pc1>1?"s":""));
  const li = arr => arr.map(x => `<li>${escapeHtml(x)}</li>`).join("");

  return `
    <h1>Compte rendu — ${escapeHtml(m.title)}</h1>
    <p>${escapeHtml(metaParts.join(" · "))}</p>
    <h2>Résumé</h2>
    <p>${escapeHtml(r.resume||"")}</p>
    ${(r.points_abordes||[]).length ? `<h2>Points abordés</h2><ul>${li(r.points_abordes)}</ul>` : ""}
    ${(r.decisions||[]).length ? `<h2>Décisions prises</h2><ul>${li(r.decisions)}</ul>` : ""}
    ${(r.actions||[]).length ? `<h2>Actions</h2>
      <table>
        <tr><th>Action</th><th>Responsable</th><th>Échéance</th><th>Statut</th></tr>
        ${r.actions.map(a => `<tr><td>${escapeHtml(a.tache||"")}</td><td>${escapeHtml(a.responsable||"—")}</td><td>${escapeHtml(a.echeance||"—")}</td><td>${escapeHtml(actionStatusLabel(a))}</td></tr>`).join("")}
      </table>` : ""}
    ${(r.questions||[]).length ? `<h2>Questions non résolues</h2><ul>${li(r.questions)}</ul>` : ""}
    ${r.prochaine_reunion ? `<h2>Prochaine réunion</h2><p>${escapeHtml(r.prochaine_reunion)}</p>` : ""}
  `;
}

function exportPDF(m){
  const printArea = document.getElementById("print-area");
  printArea.innerHTML = buildReportHTMLBody(m);
  window.print();
}

function exportWord(m){
  const body = buildReportHTMLBody(m);
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>${escapeHtml(m.title)}</title></head>
  <body style="font-family:Calibri,Arial,sans-serif;">${body}</body></html>`;
  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = safeFileName(m.title) + ".doc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function copyReport(m){
  const text = buildReportPlainText(m);
  try{
    await navigator.clipboard.writeText(text);
    exportNotice = "Compte rendu copié ✓";
  }catch(e){
    exportNotice = "Impossible de copier automatiquement — sélectionne et copie le texte manuellement.";
  }
  render();
}

async function shareReport(m){
  const text = buildReportPlainText(m);
  if(navigator.share){
    try{ await navigator.share({ title: "Compte rendu — " + m.title, text }); }
    catch(e){ /* partage annulé par l'utilisateur */ }
  }else{
    try{
      await navigator.clipboard.writeText(text);
      exportNotice = "Partage non disponible sur ce navigateur — le texte a été copié.";
    }catch(e){
      exportNotice = "Partage non disponible sur ce navigateur.";
    }
    render();
  }
}

function emailReport(m){
  const emails = (m.participants||[]).map(p => (p.email||"").trim()).filter(Boolean);
  const subject = encodeURIComponent("Compte rendu — " + m.title);
  const body = encodeURIComponent(buildReportPlainText(m));
  window.location.href = `mailto:${emails.join(",")}?subject=${subject}&body=${body}`;
}

function commitReportEditFromDOM(m, finalize){
  const titleInput = document.getElementById("edit-report-title");
  const dateInput = document.getElementById("edit-report-date");
  const resumeInput = document.getElementById("edit-report-resume");
  const nextInput = document.getElementById("edit-report-next");

  if(titleInput && titleInput.value.trim()) m.title = titleInput.value.trim();
  if(dateInput && dateInput.value){
    const [y, mo, da] = dateInput.value.split("-").map(Number);
    const newDate = new Date(m.date);
    newDate.setFullYear(y, mo-1, da);
    m.date = newDate;
  }
  if(resumeInput) m.report.resume = resumeInput.value;

  let points = Array.from(document.querySelectorAll(".edit-point")).map(el => el.value);
  let decisions = Array.from(document.querySelectorAll(".edit-decision")).map(el => el.value);
  let questions = Array.from(document.querySelectorAll(".edit-question")).map(el => el.value);
  const oldActions = m.report.actions || [];
  let actions = Array.from(document.querySelectorAll(".edit-action-row")).map((row, i) => ({
    tache: row.querySelector(".edit-action-tache")?.value || "",
    responsable: row.querySelector(".edit-action-resp")?.value || "",
    echeance: row.querySelector(".edit-action-ech")?.value || "",
    status: (oldActions[i] && oldActions[i].status) || "a_faire",
    completedDate: (oldActions[i] && oldActions[i].completedDate) || null
  }));

  if(finalize){
    points = points.filter(v => v.trim());
    decisions = decisions.filter(v => v.trim());
    questions = questions.filter(v => v.trim());
    actions = actions.filter(a => a.tache.trim());
  }

  m.report.points_abordes = points;
  m.report.decisions = decisions;
  m.report.questions = questions;
  m.report.actions = actions;
  if(nextInput) m.report.prochaine_reunion = nextInput.value.trim();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- events ----------
function bindEvents(){
  const app = document.getElementById("app");

  const newBtn = app.querySelector("[data-new]");
  if(newBtn) newBtn.onclick = () => { view = "new"; render(); };

  const saveSettingsBtn = app.querySelector("[data-save-settings]");
  if(saveSettingsBtn) saveSettingsBtn.onclick = () => {
    const input = document.getElementById("settings-username");
    if(input && input.value.trim()) userName = input.value.trim();
    settingsSaved = true;
    render();
  };

  const installBtn = app.querySelector("[data-install-app]");
  if(installBtn) installBtn.onclick = () => triggerInstall();

  const dismissInstallBtn = app.querySelector("[data-dismiss-install]");
  if(dismissInstallBtn) dismissInstallBtn.onclick = () => { installBannerDismissed = true; render(); };

  const resetDataBtn = app.querySelector("[data-reset-data]");
  if(resetDataBtn) resetDataBtn.onclick = () => {
    if(window.confirm("Effacer toutes les réunions ? Cette action est irréversible.")){
      meetings = [];
      settingsSaved = false;
      view = "dashboard";
      render();
    }
  };

  const openMembersBtn = app.querySelector("[data-open-members]");
  if(openMembersBtn) openMembersBtn.onclick = () => { membersSaved = false; view = "members"; render(); };

  const openOrganizationBtn = app.querySelector("[data-open-organization]");
  if(openOrganizationBtn) openOrganizationBtn.onclick = () => { organizationSaved = false; view = "organization"; render(); };

  const openRolesBtn = app.querySelector("[data-open-roles]");
  if(openRolesBtn) openRolesBtn.onclick = () => { rolesSaved = false; view = "roles"; render(); };

  const openProjectsBtn = app.querySelector("[data-open-projects]");
  if(openProjectsBtn) openProjectsBtn.onclick = () => { projectsSaved = false; view = "projects"; render(); };

  const gotoMeetingsBtn = app.querySelector("[data-goto-meetings]");
  if(gotoMeetingsBtn) gotoMeetingsBtn.onclick = () => { view = "list"; render(); };

  const openOrgActivityBtn = app.querySelector("[data-open-org-activity]");
  if(openOrgActivityBtn) openOrgActivityBtn.onclick = () => { view = "org-activity"; render(); };

  const backOrganizationBtn = app.querySelector("[data-back-organization]");
  if(backOrganizationBtn) backOrganizationBtn.onclick = () => {
    if(view === "members"){
      syncMembersFromDOM();
      orgMembers = orgMembers.filter(mem => mem.name.trim() || mem.role.trim());
    }else if(view === "roles"){
      syncRolesFromDOM();
      orgRoles = orgRoles.filter(r => r.name.trim());
    }else if(view === "projects"){
      syncProjectsFromDOM();
      orgProjects = orgProjects.filter(p => p.name.trim());
    }
    view = "organization";
    render();
  };

  const saveOrganizationBtn = app.querySelector("[data-save-organization]");
  if(saveOrganizationBtn) saveOrganizationBtn.onclick = () => {
    const name = document.getElementById("org-name");
    const type = document.getElementById("org-type");
    const address = document.getElementById("org-address");
    const phone = document.getElementById("org-phone");
    organization = {
      ...organization,
      name: name ? name.value.trim() : organization.name,
      type: type ? type.value : organization.type,
      address: address ? address.value.trim() : organization.address,
      phone: phone ? phone.value.trim() : organization.phone
    };
    organizationSaved = true;
    render();
  };

  const orgLogoInput = app.querySelector("#org-logo-input");
  if(orgLogoInput) orgLogoInput.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      organization.logo = reader.result;
      render();
    };
    reader.readAsDataURL(file);
  };

  const orgBannerInput = app.querySelector("#org-banner-input");
  if(orgBannerInput) orgBannerInput.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      organization.banner = reader.result;
      render();
    };
    reader.readAsDataURL(file);
  };

  const addRoleBtn = app.querySelector("[data-add-role]");
  if(addRoleBtn) addRoleBtn.onclick = () => {
    syncRolesFromDOM();
    orgRoles.push({ id: roleIdCounter++, name:"" });
    rolesSaved = false;
    render();
  };

  app.querySelectorAll("[data-remove-role]").forEach(el => {
    el.onclick = () => {
      syncRolesFromDOM();
      const id = Number(el.dataset.removeRole);
      orgRoles = orgRoles.filter(r => r.id !== id);
      rolesSaved = false;
      render();
    };
  });

  const saveRolesBtn = app.querySelector("[data-save-roles]");
  if(saveRolesBtn) saveRolesBtn.onclick = () => {
    syncRolesFromDOM();
    orgRoles = orgRoles.filter(r => r.name.trim());
    rolesSaved = true;
    render();
  };

  const addProjectBtn = app.querySelector("[data-add-project]");
  if(addProjectBtn) addProjectBtn.onclick = () => {

// ---------- recording + live transcription ----------
function startTimer(){
  timerInterval = setInterval(() => {
    secondsElapsed++;
    const t = document.querySelector(".rec-timer");
    if(t) t.textContent = fmtTimer(secondsElapsed);
  }, 1000);
}
function stopTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

function startRecognition(m){
  if(!speechSupported) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = "fr-FR";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = (e) => {
    let finalChunk = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i];
      if(res.isFinal) finalChunk += res[0].transcript + " ";
    }
    finalChunk = finalChunk.trim();
    if(finalChunk){
      m.segments = m.segments || [];
      m.segments.push({ id: segIdCounter++, time: fmtTimer(secondsElapsed), speaker: "", text: finalChunk });
      m.transcript = segmentsToText(m.segments);
    }
  };
  recognition.onerror = () => {};
  recognition.start();
}
function stopRecognition(){
  if(recognition){ try{ recognition.stop(); }catch(e){} recognition = null; }
}

async function startRecordingSession(){
  const m = meetings.find(x => x.id === currentId);
  reportError = "";
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type:"audio/webm" });
      m.audioURL = URL.createObjectURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();

    secondsElapsed = 0;
    startTimer();
    startRecognition(m);

    recordingSessionActive = true;
    paused = false;
    confirmingEnd = false;
    m.status = "enregistrement";
    render();
  }catch(err){
    reportError = "Impossible d'accéder au micro : vérifie les autorisations de l'application.";
    render();
  }
}

function togglePause(){
  const m = meetings.find(x => x.id === currentId);
  if(!paused){
    if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.pause();
    stopRecognition();
    stopTimer();
    paused = true;
  }else{
    if(mediaRecorder && mediaRecorder.state === "paused") mediaRecorder.resume();
    startRecognition(m);
    startTimer();
    paused = false;
  }
  render();
}

function clickTerminer(){
  if(!paused){
    if(mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.pause();
    stopRecognition();
    stopTimer();
    paused = true;
  }
  confirmingEnd = true;
  render();
}

function cancelEnd(){
  const m = meetings.find(x => x.id === currentId);
  confirmingEnd = false;
  if(mediaRecorder && mediaRecorder.state === "paused") mediaRecorder.resume();
  startRecognition(m);
  startTimer();
  paused = false;
  render();
}

function finalizeAndGenerate(){
  const m = meetings.find(x => x.id === currentId);
  if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  stopRecognition();
  stopTimer();
  if(m) m.durationSeconds = secondsElapsed;
  recordingSessionActive = false;
  paused = false;
  confirmingEnd = false;
  render();
  generateReport();
}

function resetAudio(m){
  const msg = m.entryMode === "record"
    ? "Réinitialiser l'enregistrement ? L'audio, la transcription et le compte rendu de cette réunion seront supprimés."
    : "Réinitialiser l'audio importé ? Le fichier audio et le compte rendu seront supprimés (la transcription déjà saisie sera conservée).";
  if(!window.confirm(msg)) return;

  m.audioURL = null;
  m.audioFileName = null;
  m.durationSeconds = null;
  m.status = "brouillon";
  m.report = null;
  if(m.entryMode === "record"){
    m.segments = [];
    m.transcript = "";
  }
  reportError = "";
  render();
}

function abortRecordingIfActive(){
  if(recordingSessionActive){
    if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    stopRecognition();
    stopTimer();
    recordingSessionActive = false;
    paused = false;
    confirmingEnd = false;
  }
}

// ---------- AI report generation ----------
function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

async function callReportAPI(transcript){
  const membersContext = orgMembers.length
    ? `\nMembres connus de l'organisation (utilise ces noms et rôles pour mieux attribuer les actions et corriger d'éventuelles erreurs de transcription sur les noms) :\n${orgMembers.map(mem => `- ${mem.name}${mem.role ? " (" + mem.role + ")" : ""}`).join("\n")}\n`
    : "";

  const prompt = `Tu es un assistant qui rédige des comptes rendus de réunion structurés en français.
À partir de la transcription ci-dessous, réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans balises markdown, au format exact :
{"resume": "un résumé clair en 2-4 phrases", "points_abordes": ["sujet 1", "sujet 2"], "decisions": ["décision 1", "décision 2"], "actions": [{"tache": "description de la tâche", "responsable": "nom ou rôle si mentionné, sinon vide", "echeance": "délai si mentionné, sinon vide"}], "questions": ["question restée sans réponse"], "prochaine_reunion": "date ou texte si une prochaine réunion est mentionnée, sinon chaîne vide"}
Laisse un tableau vide si une catégorie n'est pas présente dans la transcription. N'invente rien qui ne soit pas dans la transcription.
${membersContext}
Transcription :
"""${transcript}"""`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role:"user", content: prompt }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(c => c.type === "text");
  if(!textBlock) throw new Error("Réponse vide");
  const clean = textBlock.text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

function buildMemoryCorpus(){

async function callMemoryAPI(question){
  const corpus = buildMemoryCorpus();
  const membersContext = orgMembers.length
    ? `\nMembres connus de l'organisation :\n${orgMembers.map(mem => `- ${mem.name}${mem.role ? " (" + mem.role + ")" : ""}`).join("\n")}\n`
    : "";
  const prompt = `Tu es la mémoire d'une organisation, construite à partir des comptes rendus de ses réunions passées.
On te donne la liste des réunions enregistrées (au format JSON) et une question posée par un membre de l'organisation.
Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ni après, sans balises markdown, au format exact :
{"reponse": "réponse synthétique, une information par ligne séparée par un retour à la ligne, en citant la date de chaque réunion concernée ; termine si pertinent par une ligne 'Dernière décision connue : ...'", "reunions_utilisees": [id1, id2]}
N'invente rien qui ne soit pas dans les réunions fournies. Si aucune réunion ne permet de répondre, renvoie {"reponse": "Aucune information trouvée dans les réunions enregistrées à ce sujet.", "reunions_utilisees": []}.
${membersContext}
Réunions :
${JSON.stringify(corpus)}

Question : "${question}"`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role:"user", content: prompt }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(c => c.type === "text");
  if(!textBlock) throw new Error("Réponse vide");
  const clean = textBlock.text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

async function askMemory(){
  const input = document.getElementById("memory-question");
  const question = (input?.value || memoryQuery || "").trim();
  memoryError = "";

  if(!question){
    memoryError = "Écris une question pour interroger la mémoire.";
    render();
    return;
  }
  if(!meetings.length){
    memoryError = "Aucune réunion enregistrée pour l'instant.";
    render();
    return;
  }

  memoryQuery = question;
  memoryLoading = true;
  memoryAnswer = null;
  showMemorySources = false;
  render();

  try{
    memoryAnswer = await callMemoryAPI(question);
  }catch(e){
    memoryError = "La recherche dans la mémoire a échoué. Réessaie dans un instant.";
  }
  memoryLoading = false;
  render();
}

async function generateReport(){
  const m = meetings.find(x => x.id === currentId);
  const transcript = getMeetingTranscriptText(m).trim();
  reportError = "";
  editingReport = false;

  if(!transcript){
    reportError = "Ajoute d'abord une transcription (enregistre la réunion ou saisis le texte manuellement).";
    render();
    return;
  }
  m.transcript = transcript;

  processing = true;
  processingStepIndex = 0;
  render();

  const apiPromise = callReportAPI(transcript).then(r => ({ ok:true, data:r })).catch(() => ({ ok:false }));

  await sleep(550); processingStepIndex = 1; render();
  await sleep(550); processingStepIndex = 2; render();
  await sleep(550); processingStepIndex = 3; render();
  await sleep(450); processingStepIndex = 4; render();

  const result = await apiPromise;

  processingStepIndex = 5; render();
  await sleep(450);
  processingStepIndex = 6; render();
  await sleep(900);

  processing = false;
  if(result.ok){
    m.report = result.data;
    m.report.actions = (m.report.actions || []).map(a => ({ ...a, status: "a_faire", completedDate: null }));
    m.status = "termine";
  }else{
    reportError = "La génération du rapport a échoué. Réessaie dans un instant.";
  }
  render();
}

        tache: a.tache,
        responsable: a.responsable,
        echeance: a.echeance,
        statut: actionStatusLabel(a),
        en_retard: a.status !== "termine" && !!(parseFrenchDate(a.echeance) && parseFrenchDate(a.echeance) < today)
      }));
    }else{
      const t = getMeetingTranscriptText(m);
      entry.extrait_transcription = t ? t.slice(0, 600) : "";
    }
    return entry;
  });
}

async function callAssistantAPI(){
  const history = assistantMessages.filter(m => !m.loading).map(m => ({ role: m.role, content: m.text }));
  const membersContext = orgMembers.length
    ? `\nMembres connus de l'organisation (utilise ces noms et rôles pour répondre aux questions sur qui occupe quel rôle) :\n${orgMembers.map(mem => `- ${mem.name}${mem.role ? " (" + mem.role + ")" : ""}`).join("\n")}\n`
    : "";
  const systemPrompt = `Tu es l'assistant IA de l'application "Réunion IA". Tu réponds aux questions d'un membre de l'organisation sur l'historique de ses réunions, en te basant UNIQUEMENT sur les réunions listées ci-dessous (résumés, décisions, actions avec leur statut et échéance, ou extraits de transcription pour celles sans compte rendu) et sur la liste des membres. N'invente jamais une information absente de ces données ; dis-le clairement si tu ne trouves pas la réponse. Cite les dates des réunions concernées quand c'est pertinent. Réponds de façon concise et directe, en français.
${membersContext}
Réunions disponibles (JSON) :
${JSON.stringify(buildAssistantCorpus())}`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 800,
      system: systemPrompt,
      messages: history
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(c => c.type === "text");
  if(!textBlock) throw new Error("Réponse vide");
  return textBlock.text.trim();
}

function renderAssistantMessages(){
  const container = document.getElementById("assistant-messages");
  if(!container) return;
  if(!assistantMessages.length){
    container.innerHTML = `
      <div class="assistant-suggestions">
        <div class="notice" style="margin-bottom:4px;">Essaie par exemple :</div>
        ${ASSISTANT_SUGGESTIONS.map(q => `<button class="suggestion-chip" data-suggestion="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join("")}
      </div>
    `;
    container.querySelectorAll("[data-suggestion]").forEach(btn => {
      btn.onclick = () => sendAssistantMessage(btn.dataset.suggestion);
    });
  }else{
    container.innerHTML = assistantMessages.map(m => `
      <div class="msg ${m.role}${m.loading ? " loading" : ""}">${escapeHtml(m.text).replace(/\n/g, "<br>")}</div>
    `).join("");
  }
  container.scrollTop = container.scrollHeight;
}

async function sendAssistantMessage(text){
  const q = (text||"").trim();
  if(!q) return;

  const input = document.getElementById("assistant-input");
  if(input) input.value = "";

  assistantMessages.push({ role:"user", text:q });

  if(!meetings.length){
    assistantMessages.push({ role:"assistant", text:"Aucune réunion enregistrée pour l'instant — je n'ai encore aucune information à partager." });
    renderAssistantMessages();
    return;
  }

  assistantMessages.push({ role:"assistant", text:"…", loading:true });
  renderAssistantMessages();

  try{
    const reply = await callAssistantAPI();
    assistantMessages[assistantMessages.length-1] = { role:"assistant", text: reply };
  }catch(e){
    assistantMessages[assistantMessages.length-1] = { role:"assistant", text:"Désolé, la recherche a échoué. Réessaie dans un instant." };
  }
  renderAssistantMessages();
}

function openAssistant(){
  assistantOpen = true;
  const overlay = document.getElementById("assistant-overlay");
  if(overlay) overlay.style.display = "block";
  renderAssistantMessages();
}
function closeAssistant(){
  assistantOpen = false;
  const overlay = document.getElementById("assistant-overlay");
  if(overlay) overlay.style.display = "none";
}

function initChrome(){
  updateClockDisplay();
  setInterval(updateClockDisplay, 1000 * 30);

  const settingsBtn = document.getElementById("goto-settings-btn");
  if(settingsBtn) settingsBtn.onclick = () => {
    abortRecordingIfActive();
    settingsSaved = false;
    view = "settings";
    render();
  };

  const fabBtn = document.getElementById("assistant-fab");
  if(fabBtn) fabBtn.onclick = () => openAssistant();

  const closeBtn = document.getElementById("assistant-close-btn");
  if(closeBtn) closeBtn.onclick = () => closeAssistant();

  const sendBtn = document.getElementById("assistant-send-btn");
  const inputEl = document.getElementById("assistant-input");
  if(sendBtn && inputEl){
    sendBtn.onclick = () => sendAssistantMessage(inputEl.value);
    inputEl.onkeydown = (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendAssistantMessage(inputEl.value);
      }
    };
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
      const tab = btn.dataset.tab;
      abortRecordingIfActive();
      editingReport = false;
      exportNotice = "";
      if(tab === "settings") settingsSaved = false;
      view = tab;
      render();
    };
  });
}

// Raccourci PWA "Nouvelle réunion" (?action=new)
if(new URLSearchParams(window.location.search).get("action") === "new"){
  view = "new";
}

render();
initChrome();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch((err) => {
      console.warn("Enregistrement du service worker échoué :", err);
    });
  });
}
</script>
