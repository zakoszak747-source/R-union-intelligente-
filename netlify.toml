
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# Raccourci pratique : appeler /api/transcribe au lieu de l'URL complète
# /.netlify/functions/transcribe
[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
